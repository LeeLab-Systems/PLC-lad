<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учебный ПЛК — редактор LAD</title>
<style>
:root{
  --bg:#e3e8eb;--card:#ffffff;--ink:#17242b;--muted:#56666e;--line:#cbd4d9;--grid:#eef2f4;
  --accent:#00808a;--accent2:#d9f0f1;--on:#14a03b;--off:#2f6fd0;--wire:#17242b;--lad:#fbfcfd;--err:#d5302a;--warn:#c98a00;
  --plc:#2b383e;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171a;--card:#1a2226;--ink:#e2e9ec;--muted:#93a2a9;--line:#2d393f;--grid:#222c31;
  --accent:#2fb8c0;--accent2:#173a3d;--on:#3ad063;--off:#5f9dff;--wire:#c8d3d8;--lad:#151c20;--err:#ff5a4f;--warn:#f0b429;--plc:#232e33;
}}
:root[data-theme="dark"]{
  --bg:#11171a;--card:#1a2226;--ink:#e2e9ec;--muted:#93a2a9;--line:#2d393f;--grid:#222c31;
  --accent:#2fb8c0;--accent2:#173a3d;--on:#3ad063;--off:#5f9dff;--wire:#c8d3d8;--lad:#151c20;--err:#ff5a4f;--warn:#f0b429;--plc:#232e33;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit}
button:focus-visible,[data-e]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1240px;margin:0 auto;padding:14px 16px 4px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:40px;height:40px;border-radius:6px;background:var(--plc);display:grid;place-items:center;flex:0 0 auto}
h1{font-size:19px;margin:0;line-height:1.2;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer}
.tabs button.ok{border-color:var(--on)}
.tabs button.ok::after{content:" ✓";color:var(--on);font-weight:700}
.tabs button.act{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button.act.ok::after{color:#fff}
.layout{max-width:1240px;margin:0 auto;padding:8px 16px 28px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;gap:14px}
.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:16.5px;margin:0 0 6px;line-height:1.25}
.muted{color:var(--muted);font-size:12.5px}

/* CPU */
.cpu{background:var(--plc);color:#e9eef0;border-radius:10px;padding:12px;border:1px solid #1b2428}
.cpuh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.cpun{font:600 13px var(--mono)}
.cpus{font-size:12px;color:#a9b8bf}
.leds{display:flex;gap:8px}
.led{display:flex;align-items:center;gap:4px;font:600 10.5px var(--mono);color:#b9c6cc}
.led i{width:10px;height:10px;border-radius:50%;background:#46535a}
.led.g.on i{background:#3ee06a;box-shadow:0 0 8px #3ee06a}
.led.y.on i{background:#ffc531;box-shadow:0 0 8px #ffc531}
.iorow{display:flex;align-items:center;gap:3px;margin:6px 0}
.iol{font:600 10.5px var(--mono);color:#a9b8bf;width:38px;flex:0 0 auto}
.io{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:10px var(--mono);color:#a9b8bf}
.io i{width:13px;height:8px;border-radius:2px;background:#46535a}
.io.on i{background:#3ee06a;box-shadow:0 0 6px #3ee06a}
.cpub{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid #56666d;background:#3a4a51;color:#eef3f5;border-radius:6px;padding:8px;font-size:13px;font-weight:500;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.phd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ptitle{font-size:13px;font-weight:600;color:var(--muted)}
.mini{border:none;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:2px 4px}
.panel.min .devs{display:none}
.panel.min .phd{margin-bottom:0}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px 6px}
.dev{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.dn{font-size:11.5px;line-height:1.15}
.dn b{font-family:var(--mono);font-weight:600}
.dw{font:10px var(--mono);color:var(--muted)}
.pb{--pc:#888;width:46px;height:46px;border-radius:50%;border:3px solid #a7b2b8;padding:0;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 45%),var(--pc);
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.2);cursor:pointer;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .05s}
.pb.green{--pc:#1e9a46}.pb.red{--pc:#d5302a}.pb.blue{--pc:#2a66c8}.pb.yellow{--pc:#e2ae16}.pb.black{--pc:#2b3236}
.pb.on{transform:translateY(2px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(.82)}
.tg{height:46px;min-width:68px;border-radius:8px;border:2px solid var(--line);background:var(--grid);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tg .b{display:none}.tg.on{background:#d5302a;border-color:#a62019;color:#fff}.tg.on .a{display:none}.tg.on .b{display:inline}
.lamp{--lc:#888;width:34px;height:34px;margin:6px 0;border-radius:50%;border:3px solid #a7b2b8;background:color-mix(in srgb,var(--lc) 22%,#2b3236)}
.lamp[data-c=green]{--lc:#35e06a}.lamp[data-c=red]{--lc:#ff3b30}.lamp[data-c=yellow]{--lc:#ffc21a}
.lamp.on{background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.6),transparent 50%),var(--lc);box-shadow:0 0 18px var(--lc)}
.mot{width:46px;height:46px;color:var(--muted)}
.mot svg{width:100%;height:100%;display:block}
.mot .mc{fill:var(--grid);stroke:currentColor;stroke-width:2.5}
.mot .rot *{stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:currentColor}
.mot .rot{transform-origin:20px 20px}
.mot.on{color:var(--on)}
.mot.on .rot{animation:spin .6s linear infinite}
.mot.rev.on .rot{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mot.on .rot{animation-duration:2.5s}}

/* Task */
.goal{margin:0 0 10px}
.wiring{border-top:1px solid var(--line);padding-top:8px}
.wt{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.wr{display:grid;grid-template-columns:44px 1fr auto;gap:6px;font-size:13px;padding:3px 0;align-items:baseline}
.wr b{font-family:var(--mono)}
.wr span{color:var(--muted);font-size:12px}
.wr code{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14.5px}
.th{font-size:14px;max-width:72ch}.th p{margin:8px 0}
code{font-family:var(--mono);font-size:.9em}
.th code{background:var(--grid);padding:1px 4px;border-radius:3px}
.tact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.primary{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer}
.rep{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--grid)}
.rep h3{margin:0 0 6px;font-size:14.5px}
.rep.pass{border-color:var(--on)}
.rep ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rep li{font-size:13.5px;display:flex;gap:7px}
.rep li::before{content:"✓";color:var(--on);font-weight:700;flex:0 0 12px}
.rep li.bad::before{content:"✗";color:var(--err)}
.rep li.skip{color:var(--muted)}
.rep li.skip::before{content:"·";color:var(--muted)}

/* Editor */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);margin:-14px -14px 0;padding:10px 14px 8px;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.thd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.blk{font:600 14px var(--mono)}
.status{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--on);flex:0 0 auto}
.status.dirty .dot{background:var(--warn)}
.tb{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px}
.tb button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;padding:5px 5px 4px;border:1px solid var(--line);background:var(--grid);border-radius:6px;color:var(--ink);font-size:10.5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb svg{width:30px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.tb svg text{fill:currentColor;stroke:none;font:600 9px var(--mono)}
.tb .bx{font:600 11px var(--mono);height:16px;line-height:16px}
.tb button.dl{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb button.dl.clean{background:var(--grid);color:var(--ink);border-color:var(--line)}
.tb .sep{flex:0 0 1px;background:var(--line);margin:3px 2px}
.opbar{display:flex;gap:6px;overflow-x:auto;margin-top:8px;align-items:center;min-height:30px;padding-bottom:2px}
.opbar .muted{white-space:nowrap}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip small{font-family:var(--mono);opacity:.75;margin-left:4px}
.chip.flip{border-style:dashed}
.fld{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.fld input{width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:13px var(--mono)}
.comp{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.comp .ch{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.comp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.comp li::before{content:"● ";color:var(--warn)}
.comp li.e::before{color:var(--err)}
.net{border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden;background:var(--lad)}
.net.selnet{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nh{font-size:13px;font-weight:600;padding:7px 10px;background:var(--grid);border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.nn{font-family:var(--mono);color:var(--accent)}
.nh .muted{font-weight:400}
.nt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ncm{font-size:12.5px;color:var(--muted);font-style:italic;padding:5px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.ned{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.ned input,.ned textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--lad);color:var(--ink);font-size:13.5px;font-family:inherit}
.ned textarea{min-height:52px;resize:vertical}
.ned input{font-weight:600}
.chip:disabled{opacity:.4;cursor:default}
.ver{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle;font-weight:400}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.net .sc{padding:6px 4px 8px}
.addnet{margin-top:10px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--accent);padding:10px;border-radius:8px;font-size:13.5px;cursor:pointer}

.lad{display:block}
.lad .w{stroke:var(--wire);stroke-width:2;fill:none}
.lad .pl{stroke:var(--wire);stroke-width:2.3;fill:none}
.lad .rail{stroke-width:3.5}
.live .lad .w.on{stroke:var(--on);stroke-width:2.8}
.live .lad .w:not(.on){stroke:var(--off);stroke-dasharray:5 4}
.live .lad .ct.on .pl{stroke:var(--on);stroke-width:2.8}
.live .lad .ct:not(.on) .pl{stroke:var(--off)}
.lad text{font-family:var(--mono);fill:var(--ink);text-anchor:middle}
.lad .sym{font-size:9px}
.lad .adr{font-size:8.5px;fill:var(--muted)}
.lad .err{fill:var(--err);font-weight:600}
.lad .box{fill:var(--card);stroke:var(--wire);stroke-width:1.5}
.lad .bt{font-weight:600;font-size:11px}
.lad .bs{font-size:8.5px;fill:var(--muted)}
.lad .pin{font-size:9px;text-anchor:start}
.lad .pin.r{text-anchor:end}
.lad .opd{font-size:9px;text-anchor:end;fill:var(--accent)}
.lad .val{font-size:9px;text-anchor:start;fill:var(--accent);font-weight:600}
.lad .st{stroke:var(--wire);stroke-width:1.5}
.lad .cl{font-size:11px;font-weight:600}
.lad .hit{fill:transparent;stroke:none}
.lad [data-e]{cursor:pointer}
.lad .sel .hit{fill:var(--accent2);stroke:var(--accent);stroke-width:1.5}
.lad .ph{font-size:10px;fill:var(--muted)}

/* Tags */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px}
td{padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
td:nth-child(2),td.v{font-family:var(--mono);white-space:nowrap;padding-top:7px}
td small{display:block;color:var(--muted);font-size:11.5px;padding-left:5px}
td.v.b{color:var(--off)}
td.v.b.on{color:var(--on);font-weight:600}
td.v:not(.b){color:var(--accent);font-weight:600}
.tn{width:100%;min-width:100px;border:1px solid transparent;background:transparent;color:var(--ink);font:12.5px var(--mono);padding:3px 4px;border-radius:4px}
.tn:hover{border-color:var(--line)}
.tn:focus{border-color:var(--accent);outline:none;background:var(--card)}
.tdb{font-family:var(--mono);font-size:12.5px;padding:3px 5px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:50;transition:transform .2s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}

@media (max-width:820px){
  .top{padding:12px 10px 2px}
  .layout{grid-template-columns:1fr;padding:6px 10px 16px;gap:10px}
  .side{position:static;gap:10px}
  .content{gap:10px}
  .card{padding:12px 10px}
  .tools{margin:-12px -10px 0;padding:8px 10px}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:14px 14px 0 0;border-width:1px 0 0;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18);max-height:42%;overflow-y:auto}
  .phd{margin-bottom:6px}
  .devs{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px 4px}
  .pb,.tg{height:42px}.pb{width:42px}
  .lamp{width:30px;height:30px}.mot{width:42px;height:42px}
}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 26 26"><line x1="3" y1="3" x2="3" y2="23" stroke="#3ee06a" stroke-width="2.5"/><line x1="3" y1="13" x2="9" y2="13" stroke="#3ee06a" stroke-width="2"/><line x1="10" y1="7" x2="10" y2="19" stroke="#3ee06a" stroke-width="2"/><line x1="15" y1="7" x2="15" y2="19" stroke="#3ee06a" stroke-width="2"/><line x1="16" y1="13" x2="23" y2="13" stroke="#3ee06a" stroke-width="2"/></svg>
    </div>
    <div><h1>Учебный ПЛК: пишем программу сами<span class="ver">v1.0</span></h1><p>Редактор LAD в стиле TIA Portal, симуляция S7-1200</p></div>
  </div>
  <nav id="tabs" class="tabs" aria-label="Задания"></nav>
</header>
<main class="layout">
  <aside class="side">
    <section class="cpu" id="cpu" aria-label="CPU"></section>
    <section class="panel" id="panel" aria-label="Пульт и объект"></section>
  </aside>
  <div class="content">
    <section class="card" id="task"></section>
    <section class="card" id="editor">
      <div class="tools">
        <div class="thd"><span class="blk">Main [OB1]</span><span id="status" class="status"></span></div>
        <div class="tb" role="toolbar" aria-label="Инструкции LAD">
          <button data-act="download" id="dlbtn" class="dl"><svg viewBox="0 0 30 16"><path d="M15 1v10M10 7l5 5 5-5M6 15h18"/></svg>В ПЛК</button>
          <span class="sep"></span>
          <button data-tool="NO" title="Нормально открытый контакт"><svg viewBox="0 0 30 16"><path d="M0 8h10M20 8h10M11 2v12M19 2v12"/></svg>НО</button>
          <button data-tool="NC" title="Нормально закрытый контакт"><svg viewBox="0 0 30 16"><path d="M0 8h10M20 8h10M11 2v12M19 2v12M7 14L23 2"/></svg>НЗ</button>
          <button data-tool="branch" title="Параллельная ветвь к выбранному контакту"><svg viewBox="0 0 30 16"><path d="M0 4h30M5 4v10h20V4"/></svg>Ветвь</button>
          <button data-tool="=" title="Катушка"><svg viewBox="0 0 30 16"><path d="M0 8h9M21 8h9M12 2Q7 8 12 14M18 2Q23 8 18 14"/></svg>Выход</button>
          <button data-tool="S" title="Установить (Set)"><svg viewBox="0 0 30 16"><path d="M0 8h9M21 8h9M12 2Q7 8 12 14M18 2Q23 8 18 14"/><text x="15" y="11.5" text-anchor="middle">S</text></svg>Set</button>
          <button data-tool="R" title="Сбросить (Reset)"><svg viewBox="0 0 30 16"><path d="M0 8h9M21 8h9M12 2Q7 8 12 14M18 2Q23 8 18 14"/><text x="15" y="11.5" text-anchor="middle">R</text></svg>Reset</button>
          <button data-tool="TON" title="Таймер задержки включения"><span class="bx">TON</span>таймер</button>
          <button data-tool="TOF" title="Таймер задержки отключения"><span class="bx">TOF</span>таймер</button>
          <button data-tool="CTU" title="Счётчик вверх"><span class="bx">CTU</span>счётчик</button>
          <span class="sep"></span>
          <button data-act="del" title="Удалить выбранное"><span class="bx">✕</span>Удалить</button>
          <button data-act="undo" title="Отменить"><span class="bx">↶</span>Отменить</button>
        </div>
        <div class="opbar" id="opbar"></div>
      </div>
      <div id="comp"></div>
      <div id="prog"></div>
    </section>
    <section class="card">
      <h2>Таблица тегов и наблюдение</h2>
      <p class="muted" style="margin:0 0 6px">Имена можно менять: латиница, цифры и «_». Значения обновляются онлайн.</p>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BASE={
 'I0.0':['Start','SB1 Пуск'],'I0.1':['Stop','SB2 Стоп'],'I0.2':['Thermal_OK','KK1 тепловое реле'],

for(let i=0;i<8;i++)BASE['M0.'+i]=['Mem_'+i,'свободный меркер'];

 SB4:{k:'btn',name:'Назад',w:'NO',a:'I0.5',col:'black'},

 HL1:{k:'lamp',name:'Работа',a:'Q0.1',col:'green'},
 HL2:{k:'lamp',name:'Авария',a:'Q0.2',col:'red'},

/* ---------- tasks ---------- */
const start=[{pr:'SB1'}],stop=[{pr:'SB2'}];
const TASKS=[
{id:'t1',tab:'1. Лампа',name:'Кнопка и лампа',

 tests:[{x:{'Q0.1':0},m:'Без нажатия лампа не горит'},{p:'SB1'},{x:{'Q0.1':1},m:'Пока SB1 нажата, HL1 горит'},{r:'SB1'},{x:{'Q0.1':0},m:'Отпустил SB1 — HL1 погасла'}]},
{id:'t2',tab:'2. Самоподхват',name:'Пуск/Стоп с самоподхватом',
 goal:'Короткое нажатие SB1 запускает мотор KM1, он работает до нажатия SB2. Лампа HL1 горит, пока мотор работает. Стоп важнее Пуска.',
 devices:['SB1','SB2','M1','HL1'],
 hint:`<p>SB2 подключена НЗ контактом: в покое на %I0.1 приходит 1, при нажатии 0. Подумай, какой контакт нужен в программе, чтобы цепь была замкнута, пока Стоп не трогают.</p><p>Самоподхват: выбери контакт Пуск и нажми «Ветвь». В новую ветвь поставь контакт самого выхода %Q0.0. Лампу можно добавить второй катушкой в той же сети: выбери катушку и нажми «Выход».</p>`,
 tests:[{x:{'Q0.0':0},m:'В исходном состоянии мотор стоит'},...start,{x:{'Q0.0':1},m:'После короткого нажатия Пуск мотор работает (самоподхват)'},{x:{'Q0.1':1},m:'Лампа Работа горит вместе с мотором'},{p:'SB2'},{x:{'Q0.0':0,'Q0.1':0},m:'Стоп останавливает мотор и гасит лампу'},{r:'SB2'},{x:{'Q0.0':0},m:'После отпускания Стоп мотор сам не запускается'},{p:'SB2'},{p:'SB1'},{x:{'Q0.0':0},m:'При одновременном нажатии Пуск и Стоп мотор не работает'},{r:'SB1'},{r:'SB2'}]},
{id:'t3',tab:'3. Авария',name:'Тепловая защита и квитирование',
 goal:'Срабатывание теплового реле KK1 останавливает мотор и включает лампу HL2 (можно мигающую). Авария запоминается: после возврата реле мотор нельзя запустить, пока не нажат SB3 «Сброс». Сброс работает только когда KK1 в норме.',
 devices:['SB1','SB2','KK1','SB3','M1','HL1','HL2'],
 hint:`<p>Запоминание делают парой катушек «Set» и «Reset» на свободный меркер, например <code>%M0.0</code>. Переименуй его в таблице тегов в <code>Fault</code>.</p><p>KK1 подключено НЗ 95-96: в норме %I0.2 = 1, при срабатывании 0.</p><p>Для мигания поставь последовательно с аварией тактовый меркер <code>"Clock_1Hz"</code> %M20.5.</p><p>Порядок сетей важен: OB1 выполняется сверху вниз каждый цикл.</p>`,
 tests:[...start,{x:{'Q0.0':1},m:'Мотор запускается'},{t:'KK1'},{x:{'Q0.0':0},m:'Срабатывание KK1 останавливает мотор'},{see:'Q0.2',in:1200,m:'Лампа Авария горит или мигает'},{t:'KK1'},{see:'Q0.2',in:1200,m:'После возврата KK1 авария держится до квитирования'},...start,{x:{'Q0.0':0},m:'Пока авария не сброшена, пуск невозможен'},{t:'KK1'},{pr:'SB3'},{see:'Q0.2',in:1200,m:'Сброс не действует, пока KK1 сработало'},{t:'KK1'},{pr:'SB3'},{never:'Q0.2',in:1200,m:'После квитирования лампа Авария гаснет'},...start,{x:{'Q0.0':1},m:'После сброса мотор снова запускается'}]},
{id:'t4',tab:'4. TON',name:'Задержка включения TON',
 goal:'Вентилятор M2 (%Q0.3) включается через 3 с после пуска мотора и выключается сразу, когда мотор остановлен.',
 devices:['SB1','SB2','M1','M2'],
 hint:`<p>Первая сеть — мотор с самоподхватом. Во второй сети: контакт <code>%Q0.0</code>, блок TON, справа катушка вентилятора. Выбери блок и задай PT = 3 с.</p><p>TON сбрасывается, как только вход пропадает, поэтому короткий пуск меньше 3 с вентилятор не включит.</p>`,
 tests:[...start,{w:2500},{x:{'Q0.0':1,'Q0.3':0},m:'Через 2,5 с после пуска вентилятор ещё выключен'},{w:800},{x:{'Q0.3':1},m:'Через 3 с после пуска вентилятор включён'},...stop,{x:{'Q0.3':0},m:'После Стоп вентилятор сразу выключается'},...start,{w:2000},...stop,{never:'Q0.3',in:4000,m:'Короткий пуск меньше 3 с вентилятор не включает'}]},
{id:'t5',tab:'5. TOF',name:'Выбег вентилятора TOF',
 goal:'Вентилятор включается сразу вместе с мотором, а после останова мотора работает ещё 5 с.',
 devices:['SB1','SB2','M1','M2'],
 hint:`<p>TOF: выход Q = 1 сразу вместе со входом IN, а после пропадания входа держится ещё время PT. Нужен один блок между контактом мотора и катушкой вентилятора.</p>`,
 tests:[...start,{x:{'Q0.3':1},m:'Вентилятор включается сразу с мотором'},...stop,{x:{'Q0.0':0},m:'Мотор остановился'},{w:4500},{x:{'Q0.3':1},m:'Через 4,5 с после Стоп вентилятор ещё работает'},{w:800},{x:{'Q0.3':0},m:'Через 5 с вентилятор отключился'}]},
{id:'t6',tab:'6. Счётчик',name:'Счётчик партии CTU',motor:'Конвейер',tagOv:{'Q0.0':'Conveyor'},
 goal:'Датчик B1 считает детали, но только пока конвейер работает. После 5-й детали конвейер останавливается и загорается HL3. При готовой партии пуск невозможен. SB3 обнуляет счётчик.',
 devices:['SB1','SB2','B1','SB3','M1','HL3'],
 hint:`<p>CTU считает фронты 0 → 1 на входе CU. Перед блоком поставь датчик <code>%I0.4</code> и контакт конвейера <code>%Q0.0</code>, задай PV = 5, на вход R выбери <code>"Reset"</code> %I0.3.</p><p>Выход Q счётчика запиши в меркер и поставь этот меркер НЗ контактом в цепь пуска конвейера.</p>`,
 tests:[...start,{pr:'B1'},{pr:'B1'},{pr:'B1'},{pr:'B1'},{x:{'Q0.0':1,'Q0.4':0},m:'После 4 деталей конвейер работает'},{pr:'B1'},{x:{'Q0.0':0},m:'После 5-й детали конвейер остановился'},{x:{'Q0.4':1},m:'HL3 «Партия готова» горит'},...start,{x:{'Q0.0':0},m:'При готовой партии пуск невозможен'},{pr:'SB3'},{x:{'Q0.4':0},m:'SB3 сбрасывает партию'},...start,{x:{'Q0.0':1},m:'После сброса конвейер запускается'},...stop,{pr:'B1'},{pr:'B1'},{pr:'B1'},{pr:'B1'},{pr:'B1'},...start,{x:{'Q0.0':1,'Q0.4':0},m:'Детали при остановленном конвейере не считаются'}]},
{id:'t7',tab:'7. Реверс',name:'Реверс с блокировкой',tagOv:{'I0.0':'Fwd','Q0.0':'Motor_Fwd'},names:{SB1:'Вперёд',M1:'Вперёд'},
 goal:'SB1 включает вращение вперёд (KM1, %Q0.0), SB4 — назад (KM2, %Q0.5), SB2 останавливает. Пока мотор крутится в одну сторону, другую включить нельзя, сначала Стоп.',
 devices:['SB1','SB4','SB2','M1','KM2'],
 hint:`<p>Две сети, каждая с самоподхватом. В цепь каждого контактора добавь НЗ контакт другого контактора. Это программная блокировка, такая же, как блок-контакты в силовой схеме реверса.</p>`,
 tests:[...start,{x:{'Q0.0':1,'Q0.5':0},m:'SB1 запускает вращение вперёд'},{pr:'SB4'},{x:{'Q0.5':0},m:'При вращении вперёд SB4 не включает KM2'},{x:{'Q0.0':1},m:'KM1 продолжает работать'},...stop,{x:{'Q0.0':0},m:'Стоп останавливает'},{pr:'SB4'},{x:{'Q0.5':1,'Q0.0':0},m:'SB4 запускает вращение назад'},...start,{x:{'Q0.0':0},m:'При вращении назад SB1 не включает KM1'},...stop,{x:{'Q0.5':0},m:'Стоп останавливает и назад'}]},
{id:'sb',tab:'Песочница',name:'Песочница',
 goal:'Свободный режим: все входы и выходы, без проверки. Пиши что угодно.',
 devices:['SB1','SB2','KK1','SB3','B1','SB4','M1','HL1','HL2','M2','HL3','KM2']}
];

/* ---------- state & storage ---------- */
const S={run:true,mon:true,bits:{},dev:{},inst:{},now:0,prog:[],loaded:[],dirty:false,sel:null,hist:[],custom:{},comp:null,report:null,pmin:false,ti:0};
const LS='plc-lad-editor-v1';
let STORE={};try{STORE=JSON.parse(localStorage.getItem(LS))||{};}catch(e){STORE={};}
const strip=(k,v)=>k[0]==='_'?undefined:v;
const clone=o=>JSON.parse(JSON.stringify(o,strip));
function save(){try{STORE[T.id]={prog:JSON.parse(JSON.stringify(S.prog,strip)),names:S.custom,passed:!!(STORE[T.id]&&STORE[T.id].passed)||!!S.passed};localStorage.setItem(LS,JSON.stringify(STORE));}catch(e){}}
const nameOf=a=>S.custom[a]||(T.tagOv&&T.tagOv[a])||(BASE[a]?BASE[a][0]:a);
const cmtOf=a=>{const id=T.devices.find(d=>DEV[d].a===a);if(id){const d=DEV[id];return`${id} ${(T.names&&T.names[id])||d.name}, ${devKind(d)}`;}return BASE[a]?BASE[a][1]:'';};
function tagList(){const s=new Set();T.devices.forEach(id=>s.add(DEV[id].a));for(let i=0;i<8;i++)s.add('M0.'+i);s.add('M20.5');
 const ord={I:0,Q:1,M:2};return[...s].sort((a,b)=>{if(a[0]!==b[0])return ord[a[0]]-ord[b[0]];const[x1,y1]=a.slice(1).split('.').map(Number),[x2,y2]=b.slice(1).split('.').map(Number);return x1-x2||y1-y2;});}
const newNet=()=>({id:nid('n'),items:[],coils:[]});

/* ---------- PLC engine ---------- */
const gb=a=>!!(a&&X.bits[a]);
function box(e,pin){
 const st=X.inst[e.name]||(X.inst[e.name]={et:0,q:false,run:false,t0:0,cv:0,prev:false});
 const now=X.now;
 if(e.type==='TON'){
  if(pin){if(!st.run){st.run=true;st.t0=now;}st.et=Math.min(now-st.t0,e.pt);st.q=st.et>=e.pt;}
  else{st.run=false;st.et=0;st.q=false;}
 }else if(e.type==='TOF'){
  if(pin){st.q=true;st.et=0;st.run=false;}
  else if(st.q){if(!st.run){st.run=true;st.t0=now;}st.et=Math.min(now-st.t0,e.pt);if(st.et>=e.pt){st.q=false;st.run=false;}}
 }else{
  if(gb(e.r))st.cv=0;else if(pin&&!st.prev)st.cv=Math.min(st.cv+1,32767);
  st.prev=pin;st.q=st.cv>=e.pv;
 }
 return st.q;
}
function evL(l,pin){let p=pin;for(const it of l)p=evI(it,p);return p;}
function evI(e,pin){
 e._in=pin;
 if(e.k==='c'){const v=gb(e.tag);e._cl=e.t==='NO'?v:!v;e._out=pin&&e._cl;}
 else if(e.k==='b')e._out=box(e,pin);
 else if(e.k==='p'){let o=false;for(const b of e.br)o=evL(b,pin)||o;e._out=o;}
 return e._out;
}
function clrL(l){for(const e of l){e._in=e._out=e._cl=false;if(e.br)e.br.forEach(clrL);}}
function scanCtx(c,nets,devs){
 X=c;
 for(const id of devs){const d=DEV[id];if(d.a[0]!=='I')continue;const act=!!c.dev[id];c.bits[d.a]=d.w==='NO'?act:!act;}
 c.bits['M20.5']=Math.floor(c.now/500)%2===0;
 if(c.run){
  for(const n of nets){const r=evL(n.items,true);n._out=r;for(const q of n.coils){if(!q.tag)continue;if(q.t==='=')c.bits[q.tag]=r;else if(r)c.bits[q.tag]=q.t==='S';}}
 }else{
  for(const k in c.bits)if(k[0]==='Q')c.bits[k]=false;
  for(const n of nets){clrL(n.items);n._out=false;}
 }
}
function scan(){S.now=performance.now();scanCtx(S,S.dirty?S.loaded:S.prog,T.devices);paint();}

/* ---------- LAD rendering ---------- */
function grp(k){B=G[k]=[];}
function wire(x1,y1,x2,y2,fn,cls=''){const id=nid('w');B.push({id,fn});return`<line id="${id}" class="w ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
function lbl(xc,y,a){if(!a)return`<text class="err" x="${xc}" y="${y+16}">&lt;??.?&gt;</text>`;return`<text class="sym" x="${xc}" y="${y+11}">"${esc(nameOf(a))}"</text><text class="adr" x="${xc}" y="${y+22}">%${a}</text>`;}
function natL(l){if(!l.length)return{w:1,h:1};const s=l.map(natI);return{w:s.reduce((a,b)=>a+b.w,0),h:Math.max(...s.map(b=>b.h))};}
function natI(e){if(e.k==='c')return{w:1,h:1};if(e.k==='b')return{w:2,h:e.type==='CTU'?3:2};const s=e.br.map(natL);return{w:Math.max(...s.map(b=>b.w)),h:s.reduce((a,b)=>a+b.h,0)};}
const isSel=e=>S.sel&&S.sel.id===e.id;
function drawL(l,x,y,W,pin){
 if(!l.length)return wire(x,y+LY,x+W*CW,y+LY,pin);
 let s='',cx=x;
 for(const it of l){const n=natI(it);s+=drawI(it,cx,y,n);cx+=n.w*CW;}
 const last=l[l.length-1];
 if(cx<x+W*CW)s+=wire(cx,y+LY,x+W*CW,y+LY,()=>last._out);
 return s;
}
function drawI(e,x,y,n){
 let s='';const ly=y+LY;
 if(e.k==='c'){
  s+=wire(x,ly,x+24,ly,()=>e._in)+wire(x+42,ly,x+CW,ly,()=>e._out);
  const id=nid('g');B.push({id,fn:()=>e._cl});
  s+=`<g id="${id}" class="ct ${isSel(e)?'sel':''}" data-e="${e.id}" tabindex="0" role="button" aria-label="Контакт ${e.t==='NO'?'НО':'НЗ'} ${e.tag||'без операнда'}"><rect class="hit" x="${x+2}" y="${y+1}" width="${CW-4}" height="${CH-2}" rx="4"/><line class="pl" x1="${x+24}" y1="${ly-11}" x2="${x+24}" y2="${ly+11}"/><line class="pl" x1="${x+42}" y1="${ly-11}" x2="${x+42}" y2="${ly+11}"/>${e.t==='NC'?`<line class="pl" x1="${x+18}" y1="${ly+11}" x2="${x+48}" y2="${ly-11}"/>`:''}${lbl(x+CW/2,y,e.tag)}</g>`;
 }else if(e.k==='p'){
  let yy=y,last=y;
  for(const b of e.br){last=yy;s+=drawL(b,x,yy,n.w,()=>e._in);yy+=natL(b).h*CH;}
  s+=wire(x,ly,x,last+LY,()=>e._in)+wire(x+n.w*CW,ly,x+n.w*CW,last+LY,()=>e._out);
  s+=`<g class="${isSel(e)?'sel':''}" data-e="${e.id}" tabindex="0" role="button" aria-label="Параллельная группа"><rect class="hit" x="${x+n.w*CW-11}" y="${ly-14}" width="22" height="${last-y+28}" rx="6"/></g>`;
 }else{
  const h=n.h,bx=x+30,bw=2*CW-54,bt=y+16,bb=y+h*CH-6,cxm=bx+bw/2,p1=ly+34,p2=ly+64;
  const st=()=>S.inst[e.name]||{et:0,cv:0};
  s+=wire(x,ly,bx,ly,()=>e._in)+wire(bx+bw,ly,x+2*CW,ly,()=>e._out);
  let inner=`<rect class="hit" x="${x+2}" y="${y+1}" width="${2*CW-4}" height="${h*CH-2}" rx="4"/><text class="sym" x="${cxm}" y="${y+11}">"${e.name}"</text><rect class="box" x="${bx}" y="${bt}" width="${bw}" height="${bb-bt}" rx="2"/><text class="bt" x="${cxm}" y="${bt+13}">${e.type}</text><text class="bs" x="${cxm}" y="${bt+24}">${e.type==='CTU'?'Int':'Time'}</text><text class="pin" x="${bx+4}" y="${ly+3}">${e.type==='CTU'?'CU':'IN'}</text><text class="pin r" x="${bx+bw-4}" y="${ly+3}">Q</text>`;
  const lp=(yy,nm,op,bad)=>`<line class="st" x1="${bx-6}" y1="${yy}" x2="${bx}" y2="${yy}"/><text class="pin" x="${bx+4}" y="${yy+3}">${nm}</text><text class="opd ${bad?'err':''}" x="${bx-8}" y="${yy+3}">${op}</text>`;
  const rp=(yy,nm,fn)=>{const id=nid('t');B.push({id,txt:fn});return`<line class="st" x1="${bx+bw}" y1="${yy}" x2="${bx+bw+6}" y2="${yy}"/><text class="pin r" x="${bx+bw-4}" y="${yy+3}">${nm}</text><text class="val" id="${id}" x="${bx+bw+8}" y="${yy+3}"></text>`;};
  if(e.type==='CTU')inner+=lp(p1,'R',e.r?'%'+e.r:'&lt;??.?&gt;',!e.r)+lp(p2,'PV',String(e.pv))+rp(p1,'CV',()=>String(st().cv));
  else inner+=lp(p1,'PT',fmtT(e.pt))+rp(p1,'ET',()=>fmtT(st().et));
  s+=`<g class="${isSel(e)?'sel':''}" data-e="${e.id}" tabindex="0" role="button" aria-label="Блок ${e.type}">${inner}</g>`;
 }
 return s;
}
function hasBox(l){return l.some(e=>e.k==='b'||(e.br&&e.br.some(hasBox)));}
function netSVG(n){
 const ln=natL(n.items),X0=4,lw=Math.max(ln.w,2)+(hasBox(n.items)?1:0),cx=X0+lw*CW;
 const rows=Math.max(ln.h,n.coils.length||1),H=rows*CH+4,W=cx+82;
 let s=wire(2,0,2,H,()=>S.run,'rail');
 s+=drawL(n.items,X0,0,lw,()=>S.run);
 const out=()=>n._out;
 if(!n.coils.length){s+=wire(cx,LY,cx+12,LY,out)+`<text class="ph" x="${cx+44}" y="${LY+4}">нет выхода</text>`;}
 n.coils.forEach((c,j)=>{
  const ly=j*CH+LY;
  s+=j===0?wire(cx,ly,cx+12,ly,out):wire(cx+12,ly-CH,cx+12,ly,out);
  s+=wire(cx+12,ly,cx+28,ly,out);
  const id=nid('k');B.push({id,fn:out});
  s+=`<g id="${id}" class="ct ${isSel(c)?'sel':''}" data-e="${c.id}" tabindex="0" role="button" aria-label="Катушка ${c.t} ${c.tag||'без операнда'}"><rect class="hit" x="${cx+10}" y="${j*CH+1}" width="${70}" height="${CH-2}" rx="4"/><path class="pl" d="M${cx+33} ${ly-11} Q${cx+26} ${ly} ${cx+33} ${ly+11}"/><path class="pl" d="M${cx+53} ${ly-11} Q${cx+60} ${ly} ${cx+53} ${ly+11}"/>${c.t!=='='?`<text class="cl" x="${cx+43}" y="${ly+4}">${c.t}</text>`:''}${lbl(cx+43,j*CH,c.tag)}</g>`;
 });
 return`<svg class="lad" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
const fmtT=ms=>{ms=Math.round(ms/10)*10;const s=Math.floor(ms/1000),r=ms%1000;if(!s)return`T#${r}MS`;return r?`T#${s}S_${r}MS`:`T#${s}S`;};

/* ---------- editing ---------- */
function locate(id){
 for(let ni=0;ni<S.prog.length;ni++){const net=S.prog[ni];
  for(let i=0;i<net.items.length;i++){const it=net.items[i];
   if(it.id===id)return{net,ni,list:net.items,idx:i,el:it};
   if(it.k==='p')for(let bi=0;bi<it.br.length;bi++){const b=it.br[bi];for(let j=0;j<b.length;j++)if(b[j].id===id)return{net,ni,list:b,idx:j,el:b[j],par:it,bi,pidx:i};}
  }
  for(let i=0;i<net.coils.length;i++)if(net.coils[i].id===id)return{net,ni,list:net.coils,idx:i,el:net.coils[i],coil:true};
 }
 return null;
}
function walkAll(fn){const w=l=>l.forEach(e=>{fn(e);if(e.br)e.br.forEach(w);});S.prog.forEach(n=>{w(n.items);n.coils.forEach(fn);});}
function boxName(type){const pre=type==='CTU'?'IEC_Counter_':'IEC_Timer_';const used=new Set();walkAll(e=>{if(e.k==='b')used.add(e.name);});let n=0;while(used.has(pre+n+'_DB'))n++;return pre+n+'_DB';}
function targetNet(){
 if(S.sel){if(S.sel.net){const n=S.prog.find(n=>n.id===S.sel.net);if(n)return n;}else{const L=locate(S.sel.id);if(L)return L.net;}}
 return S.prog[S.prog.length-1];
}
function edit(fn){
 S.hist.push(JSON.stringify(S.prog,strip));if(S.hist.length>60)S.hist.shift();
 fn();S.dirty=true;S.comp=null;save();renderProg();renderTags();
}
function addItem(el){
 edit(()=>{
  const L=S.sel&&S.sel.id?locate(S.sel.id):null;
  if(L&&!L.coil){if(el.k==='b'&&L.par)L.net.items.splice(L.pidx+1,0,el);else L.list.splice(L.idx+1,0,el);}
  else targetNet().items.push(el);
  S.sel={id:el.id};
 });
}
function addCoil(t){
 edit(()=>{
  const el={k:'q',t,tag:null,id:nid('e')};
  const L=S.sel&&S.sel.id?locate(S.sel.id):null;
  if(L&&L.coil)L.list.splice(L.idx+1,0,el);else targetNet().coils.push(el);
  S.sel={id:el.id};
 });
}
function addBranch(){
 const L=S.sel&&S.sel.id?locate(S.sel.id):null;
 if(L&&L.el.k==='p'){edit(()=>{const nc={k:'c',t:'NO',tag:null,id:nid('e')};L.el.br.push([nc]);S.sel={id:nc.id};});return;}
 if(!L||L.coil||L.el.k!=='c'){toast('Выбери контакт, параллельно которому нужна ветвь');return;}
 edit(()=>{
  const nc={k:'c',t:'NO',tag:null,id:nid('e')};
  if(L.par)L.par.br.push([nc]);
  else L.list.splice(L.idx,1,{k:'p',id:nid('e'),br:[[L.el],[nc]]});
  S.sel={id:nc.id};
 });
}
function del(){
 if(!S.sel){toast('Сначала выбери элемент или сеть');return;}
 if(S.sel.net){edit(()=>{const i=S.prog.findIndex(n=>n.id===S.sel.net);if(i>=0)S.prog.splice(i,1);if(!S.prog.length)S.prog.push(newNet());S.sel=null;});return;}
 const L=locate(S.sel.id);if(!L)return;
 edit(()=>{
  L.list.splice(L.idx,1);
  if(L.par){if(!L.list.length)L.par.br.splice(L.bi,1);if(L.par.br.length===1)L.net.items.splice(L.pidx,1,...L.par.br[0]);}
  S.sel={net:L.net.id};
 });
}
function undo(){
 if(!S.hist.length){toast('Нечего отменять');return;}
 S.prog=JSON.parse(S.hist.pop());S.sel=null;S.dirty=true;S.comp=null;save();renderProg();renderTags();
}
function tool(t){
 if(t==='NO'||t==='NC')addItem({k:'c',t,tag:null,id:nid('e')});
 else if(t==='='||t==='S'||t==='R')addCoil(t);
 else if(t==='branch')addBranch();
 else addItem({k:'b',type:t,id:nid('e'),name:boxName(t),pt:t==='TON'?3000:5000,pv:5,r:null});
}

/* ---------- compile / download / test ---------- */
function compile(){
 const out=[],assign={};
 const wl=(l,fn)=>l.forEach(e=>{fn(e);if(e.br)e.br.forEach(b=>wl(b,fn));});
 S.prog.forEach((n,i)=>{
  const N=`Сеть ${i+1}`;
  if(!n.items.length&&!n.coils.length){out.push({e:1,m:`${N}: пустая сеть. Удали её или заполни`});return;}
  if(!n.coils.length)out.push({e:1,m:`${N}: нет катушки на выходе`});
  if(!n.items.length)out.push({e:1,m:`${N}: перед катушкой нет ни одного условия`});
  let miss=0;
  wl(n.items,e=>{if(e.k==='c'&&!e.tag)miss++;if(e.k==='b'&&e.type==='CTU'&&!e.r)out.push({e:1,m:`${N}: у счётчика не задан вход R`});if(e.k==='b'&&e.type!=='CTU'&&!(e.pt>0))out.push({e:1,m:`${N}: у таймера не задано время PT`});});
  n.coils.forEach(q=>{if(!q.tag)miss++;else if(q.t==='=')(assign[q.tag]=assign[q.tag]||[]).push(i+1);});
  if(miss)out.push({e:1,m:`${N}: не задан операнд у элементов: ${miss} (красные <??.?>)`});
 });
 for(const a in assign)if(assign[a].length>1)out.push({e:0,m:`%${a} "${nameOf(a)}" присваивается в сетях ${assign[a].join(', ')}. Сработает только последняя сеть: двойное присваивание`});
 return out;
}
function download(){
 const r=compile();S.comp=r;const errs=r.filter(x=>x.e).length;
 if(errs){toast(`Ошибок компиляции: ${errs}. Загрузка отменена`);renderProg();return;}
 S.loaded=clone(S.prog);S.dirty=false;
 for(const k in S.bits)if(k[0]==='M'&&k!=='M20.5')delete S.bits[k];
 S.inst={};
 toast(r.length?`Загружено в ПЛК. Предупреждений: ${r.length}`:'Загружено в ПЛК');
 renderProg();renderTags();
}
function runTests(){
 const r=compile();
 if(r.some(x=>x.e)){S.comp=r;S.report={fail:true,title:'Сначала исправь ошибки компиляции',res:[]};renderProg();renderReport();return;}
 const nets=clone(S.prog),c={bits:{},inst:{},now:0,dev:{},run:true};
 const step=()=>{c.now+=10;scanCtx(c,nets,T.devices);};
 const n=k=>{for(let i=0;i<k;i++)step();};
 n(5);
 const res=[];let failed=false;
 for(const s of T.tests){
  if(failed){if(s.m)res.push({skip:true,m:s.m});continue;}
  if(s.p){c.dev[s.p]=true;n(4);}
  else if(s.r){c.dev[s.r]=false;n(4);}
  else if(s.pr){c.dev[s.pr]=true;n(4);c.dev[s.pr]=false;n(4);}
  else if(s.t){c.dev[s.t]=!c.dev[s.t];n(4);}
  else if(s.w){n(Math.round(s.w/10));}
  else if(s.x){const ok=Object.entries(s.x).every(([a,v])=>!!c.bits[a]===!!v);res.push({ok,m:s.m});if(!ok)failed=true;}
  else if(s.see){let seen=false;for(let i=0;i<s.in/10;i++){step();if(c.bits[s.see])seen=true;}res.push({ok:seen,m:s.m});if(!seen)failed=true;}
  else if(s.never){let seen=false;for(let i=0;i<s.in/10;i++){step();if(c.bits[s.never])seen=true;}res.push({ok:!seen,m:s.m});if(seen)failed=true;}
 }
 X=S;
 const okN=res.filter(x=>x.ok).length,tot=res.length;
 S.report={fail:failed,title:failed?`Проверка не пройдена: ${okN} из ${tot}`:`Задание выполнено: ${tot} из ${tot}`,res};
 if(!failed){S.passed=true;save();renderTabs();}
 renderReport();
}

 const tl=t.closest('[data-tool]');if(tl){tool(tl.dataset.tool);return;}
 const op=t.closest('[data-op]');if(op){const L=locate(S.sel.id);if(L)edit(()=>{L.el.tag=op.dataset.op;});return;}
 const rr=t.closest('[data-r]');if(rr){const L=locate(S.sel.id);if(L)edit(()=>{L.el.r=rr.dataset.r;});return;}
 const tg=t.closest('[data-tog]');if(tg){S.dev[tg.dataset.tog]=!S.dev[tg.dataset.tog];return;}
 const el=t.closest('#prog [data-e]');if(el){S.sel={id:el.dataset.e};renderProg();return;}
 const nh=t.closest('[data-net]');if(nh){S.sel={net:nh.dataset.net};renderProg();return;}
 const a=t.closest('[data-act]');if(!a)return;
 const act=a.dataset.act;
 if(act==='download')download();
 else if(act==='del')del();
 else if(act==='undo')undo();
 else if(act==='flip'){const L=locate(S.sel.id);if(L)edit(()=>{L.el.t=L.el.t==='NO'?'NC':'NO';});}
 else if(act==='nup'||act==='ndn'){const i=S.prog.findIndex(n=>n&&S.sel&&n.id===S.sel.net),j=act==='nup'?i-1:i+1;if(i<0||j<0||j>=S.prog.length)return;edit(()=>{const[n]=S.prog.splice(i,1);S.prog.splice(j,0,n);});}
 else if(act==='nabove'||act==='nbelow'){const i=S.prog.findIndex(n=>S.sel&&n.id===S.sel.net);if(i<0)return;edit(()=>{const n=newNet();S.prog.splice(act==='nabove'?i:i+1,0,n);S.sel={net:n.id};});}
 else if(act==='net'){edit(()=>{const n=newNet();const tn=targetNet();const i=tn?S.prog.indexOf(tn):S.prog.length-1;S.prog.splice(i+1,0,n);S.sel={net:n.id};});}
 else if(act==='test')runTests();
 else if(act==='clear'){edit(()=>{S.prog=[newNet()];S.sel=null;});S.report=null;renderReport();toast('Программа очищена. «Отменить» вернёт её');}
 else if(act==='closecomp'){S.comp=null;renderComp();}
 else if(act==='runstop'){S.run=!S.run;if(S.run){for(const k in S.bits)if(k[0]==='M'&&k!=='M20.5')delete S.bits[k];S.inst={};}}
 else if(act==='mon'){S.mon=!S.mon;renderProg();}
 else if(act==='pmin'){S.pmin=!S.pmin;renderPanel();paint();fit();}
});
document.addEventListener('change',e=>{
 const nm0=e.target.closest('[data-nmeta]');
 if(nm0){const n=S.prog.find(x=>x.id===nm0.dataset.nid);if(!n)return;const f=nm0.dataset.nmeta,v=nm0.value.replace(/\s+$/,'').replace(/^\s+/,'');
  if((n[f]||'')===v)return;
  S.hist.push(JSON.stringify(S.prog,strip));if(S.hist.length>60)S.hist.shift();
  if(v)n[f]=v;else delete n[f];save();
  if(f==='title'){const h=document.querySelector(`.nh[data-net="${n.id}"]`);if(h){const i=S.prog.indexOf(n)+1;h.querySelector('.nn').textContent=`Сеть ${i}${v?':':''}`;let t=h.querySelector('.nt');if(v){if(!t){t=document.createElement('span');t.className='nt';h.querySelector('.nn').after(t);}t.textContent=v;}else if(t)t.remove();}}
  return;}
 const f=e.target.closest('[data-f]');
 if(f&&S.sel&&S.sel.id){const L=locate(S.sel.id);const v=parseFloat(f.value);if(!L||!(v>0)){toast('Введи число больше нуля');renderProg();return;}
  edit(()=>{if(f.dataset.f==='pt')L.el.pt=Math.round(v*1000);else L.el.pv=Math.max(1,Math.round(v));});return;}
 const nm=e.target.closest('[data-name]');
 if(nm){const v=nm.value.trim(),a=nm.dataset.name;
  if(!/^[A-Za-z_][A-Za-z0-9_]{0,23}$/.test(v)){toast('Имя: латиница, цифры и «_», начинается с буквы');nm.value=nameOf(a);return;}
  const dup=tagList().find(x=>x!==a&&nameOf(x)===v);if(dup){toast(`Имя "${v}" уже занято тегом %${dup}`);nm.value=nameOf(a);return;}
  S.custom[a]=v;save();renderProg();}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[data-nmeta]')){e.preventDefault();e.target.blur();return;}
 const el=e.target.closest&&e.target.closest('#prog [data-e]');
 if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.sel={id:el.dataset.e};renderProg();return;}
 if(el&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();S.sel={id:el.dataset.e};del();return;}
 const b=e.target.closest&&e.target.closest('.pb[data-dev]');
 if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(!e.repeat)S.dev[b.dataset.dev]=true;}
});
document.addEventListener('keyup',e=>{const b=e.target.closest&&e.target.closest('.pb[data-dev]');if(b&&(e.key==='Enter'||e.key===' '))S.dev[b.dataset.dev]=false;});
const held=new Map();
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('.pb[data-dev]');if(!b)return;
 e.preventDefault();const id=b.dataset.dev;S.dev[id]=true;held.set(e.pointerId,{id,t:performance.now()});
 try{b.setPointerCapture(e.pointerId);}catch(_){}
});
const release=e=>{const h=held.get(e.pointerId);if(!h)return;held.delete(e.pointerId);const dt=performance.now()-h.t;setTimeout(()=>{S.dev[h.id]=false;},Math.max(0,120-dt));};
document.addEventListener('pointerup',release);
document.addEventListener('pointercancel',release);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.pb'))e.preventDefault();});

const panel=$('#panel'),mq=matchMedia('(max-width:820px)');
function fit(){document.body.style.paddingBottom=mq.matches?(panel.offsetHeight+'px'):'';}
if(window.ResizeObserver)new ResizeObserver(fit).observe(panel);
mq.addEventListener?mq.addEventListener('change',fit):mq.addListener(fit);

X=S;
loadTask(0);
setInterval(scan,30);
</script>
</body>
</html>
