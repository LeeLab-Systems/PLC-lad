<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учебный ПЛК — редактор LAD</title>
<style>
:root{
  --bg:#e3e8eb;--card:#ffffff;--ink:#17242b;--muted:#56666e;--line:#cbd4d9;--grid:#eef2f4;
  --accent:#00808a;--accent2:#d9f0f1;--on:#14a03b;--off:#2f6fd0;--wire:#17242b;--lad:#fbfcfd;--err:#d5302a;--warn:#c98a00;
  --plc:#2b383e;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171a;--card:#1a2226;--ink:#e2e9ec;--muted:#93a2a9;--line:#2d393f;--grid:#222c31;
  --accent:#2fb8c0;--accent2:#173a3d;--on:#3ad063;--off:#5f9dff;--wire:#c8d3d8;--lad:#151c20;--err:#ff5a4f;--warn:#f0b429;--plc:#232e33;
}}
:root[data-theme="dark"]{
  --bg:#11171a;--card:#1a2226;--ink:#e2e9ec;--muted:#93a2a9;--line:#2d393f;--grid:#222c31;
  --accent:#2fb8c0;--accent2:#173a3d;--on:#3ad063;--off:#5f9dff;--wire:#c8d3d8;--lad:#151c20;--err:#ff5a4f;--warn:#f0b429;--plc:#232e33;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit}
button:focus-visible,[data-e]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1240px;margin:0 auto;padding:14px 16px 4px}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:40px;height:40px;border-radius:6px;background:var(--plc);display:grid;place-items:center;flex:0 0 auto}
h1{font-size:19px;margin:0;line-height:1.2;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer}
.tabs button.ok{border-color:var(--on)}
.tabs button.ok::after{content:" ✓";color:var(--on);font-weight:700}
.tabs button.act{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button.act.ok::after{color:#fff}
.layout{max-width:1240px;margin:0 auto;padding:8px 16px 28px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;gap:14px}
.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:16.5px;margin:0 0 6px;line-height:1.25}
.muted{color:var(--muted);font-size:12.5px}

/* CPU */
.cpu{background:var(--plc);color:#e9eef0;border-radius:10px;padding:12px;border:1px solid #1b2428}
.cpuh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.cpun{font:600 13px var(--mono)}
.cpus{font-size:12px;color:#a9b8bf}
.leds{display:flex;gap:8px}
.led{display:flex;align-items:center;gap:4px;font:600 10.5px var(--mono);color:#b9c6cc}
.led i{width:10px;height:10px;border-radius:50%;background:#46535a}
.led.g.on i{background:#3ee06a;box-shadow:0 0 8px #3ee06a}
.led.y.on i{background:#ffc531;box-shadow:0 0 8px #ffc531}
.iorow{display:flex;align-items:center;gap:3px;margin:6px 0}
.iol{font:600 10.5px var(--mono);color:#a9b8bf;width:38px;flex:0 0 auto}
.io{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:10px var(--mono);color:#a9b8bf}
.io i{width:13px;height:8px;border-radius:2px;background:#46535a}
.io.on i{background:#3ee06a;box-shadow:0 0 6px #3ee06a}
.cpub{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid #56666d;background:#3a4a51;color:#eef3f5;border-radius:6px;padding:8px;font-size:13px;font-weight:500;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.phd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ptitle{font-size:13px;font-weight:600;color:var(--muted)}
.mini{border:none;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:2px 4px}
.panel.min .devs{display:none}
.panel.min .phd{margin-bottom:0}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px 6px}
.dev{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.dn{font-size:11.5px;line-height:1.15}
.dn b{font-family:var(--mono);font-weight:600}
.dw{font:10px var(--mono);color:var(--muted)}
.pb{--pc:#888;width:46px;height:46px;border-radius:50%;border:3px solid #a7b2b8;padding:0;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 45%),var(--pc);
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.2);cursor:pointer;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .05s}
.pb.green{--pc:#1e9a46}.pb.red{--pc:#d5302a}.pb.blue{--pc:#2a66c8}.pb.yellow{--pc:#e2ae16}.pb.black{--pc:#2b3236}
.pb.on{transform:translateY(2px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(.82)}
.tg{height:46px;min-width:68px;border-radius:8px;border:2px solid var(--line);background:var(--grid);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tg .b{display:none}.tg.on{background:#d5302a;border-color:#a62019;color:#fff}.tg.on .a{display:none}.tg.on .b{display:inline}
.lamp{--lc:#888;width:34px;height:34px;margin:6px 0;border-radius:50%;border:3px solid #a7b2b8;background:color-mix(in srgb,var(--lc) 22%,#2b3236)}
.lamp[data-c=green]{--lc:#35e06a}.lamp[data-c=white]{--lc:#fff3c4}.lamp[data-c=blue]{--lc:#3b8fd9}.lamp[data-c=red]{--lc:#ff3b30}.lamp[data-c=yellow]{--lc:#ffc21a}
.lamp.on{background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.6),transparent 50%),var(--lc);box-shadow:0 0 18px var(--lc)}
.mot{width:46px;height:46px;color:var(--muted)}
.mot svg{width:100%;height:100%;display:block}
.mot .mc{fill:var(--grid);stroke:currentColor;stroke-width:2.5}
.mot .rot *{stroke:currentColor;stroke-width:3;stroke-linecap:round;fill:currentColor}
.mot .rot{transform-origin:20px 20px}
.mot.on{color:var(--on)}
.mot.on .rot{animation:spin .6s linear infinite}
.mot.rev.on .rot{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.mot.on .rot{animation-duration:2.5s}}

/* Task */
.goal{margin:0 0 10px}
.wiring{border-top:1px solid var(--line);padding-top:8px}
.wt{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.wr{display:grid;grid-template-columns:44px 1fr auto;gap:6px;font-size:13px;padding:3px 0;align-items:baseline}
.wr b{font-family:var(--mono)}
.wr span{color:var(--muted);font-size:12px}
.wr code{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14.5px}
.th{font-size:14px;max-width:72ch}.th p{margin:8px 0}
code{font-family:var(--mono);font-size:.9em}
.th code{background:var(--grid);padding:1px 4px;border-radius:3px}
.tact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.primary{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer}
.rep{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--grid)}
.rep h3{margin:0 0 6px;font-size:14.5px}
.rep.pass{border-color:var(--on)}
.rep ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rep li{font-size:13.5px;display:flex;gap:7px}
.rep li::before{content:"✓";color:var(--on);font-weight:700;flex:0 0 12px}
.rep li.bad::before{content:"✗";color:var(--err)}
.rep li.skip{color:var(--muted)}
.rep li.skip::before{content:"·";color:var(--muted)}

/* Editor */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);margin:-14px -14px 0;padding:10px 14px 8px;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.thd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.blk{font:600 14px var(--mono)}
.status{font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--on);flex:0 0 auto}
.status.dirty .dot{background:var(--warn)}
.tb{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px}
.tb button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;padding:5px 5px 4px;border:1px solid var(--line);background:var(--grid);border-radius:6px;color:var(--ink);font-size:10.5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb svg{width:30px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.tb svg text{fill:currentColor;stroke:none;font:600 9px var(--mono)}
.tb .bx{font:600 11px var(--mono);height:16px;line-height:16px}
.tb button.dl{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb button.dl.clean{background:var(--grid);color:var(--ink);border-color:var(--line)}
.tb .sep{flex:0 0 1px;background:var(--line);margin:3px 2px}
.opbar{display:flex;gap:6px;overflow-x:auto;margin-top:8px;align-items:center;min-height:30px;padding-bottom:2px}
.opbar .muted{white-space:nowrap}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip small{font-family:var(--mono);opacity:.75;margin-left:4px}
.chip.flip{border-style:dashed}
.fld{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.fld input{width:74px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:13px var(--mono)}
.comp{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.comp .ch{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.comp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.comp li::before{content:"● ";color:var(--warn)}
.comp li.e::before{color:var(--err)}
.net{border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden;background:var(--lad)}
.net.selnet{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nh{font-size:13px;font-weight:600;padding:7px 10px;background:var(--grid);border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.nn{font-family:var(--mono);color:var(--accent)}
.nh .muted{font-weight:400}
.nt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ncm{font-size:12.5px;color:var(--muted);font-style:italic;padding:5px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.ned{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.ned input,.ned textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--lad);color:var(--ink);font-size:13.5px;font-family:inherit}
.ned textarea{min-height:52px;resize:vertical}
.ned input{font-weight:600}
.chip:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:0;margin:0 0 10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:none;background:var(--card);color:var(--ink);padding:7px 16px;font-size:13.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.act{background:var(--accent);color:#fff}
.seg button.ok::after{content:" ✓";color:var(--on);font-weight:700}
.seg button.act.ok::after{color:#fff}
.lesson .th{max-width:72ch}
.lesson ol{padding-left:20px;margin:8px 0}.lesson li{margin:4px 0}
.lmini{overflow-x:auto;margin:10px 0;padding:6px 4px;background:var(--lad);border:1px solid var(--line);border-radius:8px}
.lmini svg{display:block}
.lmini line,.lmini path,.lmini rect{stroke:var(--wire);stroke-width:1.6;fill:none}
.lmini text{fill:var(--ink);font:11.5px var(--mono);text-anchor:middle}
.lmini text.b{font-weight:700;font-size:12.5px}.lmini text.s{font-size:11px;fill:var(--muted)}
.quiz{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.qt{font-weight:700;margin-bottom:6px}
.q{margin:10px 0}.qq{font-size:14px;margin-bottom:6px}
.qo{display:flex;flex-wrap:wrap;gap:6px}
.qb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:7px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.qb.right{border-color:var(--on);background:color-mix(in srgb,var(--on) 15%,var(--card))}
.qb.wrong{border-color:var(--err);background:color-mix(in srgb,var(--err) 12%,var(--card))}
.qe{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--grid)}
.qe.right{border-left:3px solid var(--on)}.qe.wrong{border-left:3px solid var(--err)}
.qdone{margin-top:10px;color:var(--on);font-weight:700}
.tabs button.basics{border-color:var(--accent);color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.ccard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;cursor:pointer;min-height:118px}
.ccard.ok{border-color:var(--on)}
.cc{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.cn{font-weight:700;font-size:14.5px;line-height:1.25}
.cl{color:#e2ae16;font-size:13px;letter-spacing:1px}.cl i{font-style:normal;color:var(--line)}
.ct2{font-size:12px;color:var(--muted);line-height:1.3}
.cok{margin-top:auto;font-size:12px;color:var(--on);font-weight:700}
.plant{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:10px;background:var(--lad)}
.plh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.plh .mini{margin-left:auto}
.pflag{color:var(--err);font-weight:700}
.pls{display:block;width:100%;max-width:340px;height:auto;margin:2px auto 0}
.pls .tank{fill:none;stroke:var(--wire);stroke-width:2}
.pls .tankw{fill:#3b8fd9;opacity:.75}
.pls .pm,.pls .grd{stroke:var(--wire);stroke-width:1.5}
.pls .pled{fill:#46535a}.pls .pled.on{fill:#3ee06a}
.pls .plb{font:10px var(--mono);fill:var(--muted)}
.pls .plv{font:600 13px var(--mono);fill:var(--ink);text-anchor:middle}
.pls .pipe{stroke:#8a979d;stroke-width:5;stroke-linecap:round}.pls .pipe.on{stroke:#3b8fd9}
.pls .post{fill:#6b7a80}.pls .gate{fill:var(--grid);stroke:var(--wire);stroke-width:1.5}
.pls .gbar{stroke:var(--wire);stroke-width:1.2}
.pls .whl{fill:var(--wire)}
.pls .boom{fill:#d5302a;stroke:#fff;stroke-width:1;stroke-dasharray:12 8}
.pls .car{display:none}.pls .car.on{display:inline}.pls .car rect{fill:#2a66c8}
.sn{width:30px;height:30px;margin:8px 0;border-radius:50%;border:3px solid #a7b2b8;background:#2b3236;display:flex;align-items:center;justify-content:center}
.sn i{width:12px;height:12px;border-radius:50%;background:#46535a}
.sn.on i{background:#ffc21a;box-shadow:0 0 8px #ffc21a}
.km{width:46px;height:34px;margin:6px 0;border:2px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);color:var(--muted);background:var(--grid)}
.km.on{background:var(--on);border-color:var(--on);color:#fff}
.mot.horn .hb,.mot.valve .hb{fill:var(--grid);stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.mot.horn .hw,.mot.valve .hw{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.mot.horn .hw{opacity:0}.mot.horn.on .hw{opacity:1}
.mot.horn.on,.mot.valve.on{color:var(--on)}.mot.horn.on .hb,.mot.valve.on .hb{fill:var(--on)}
.tg.gen.on{background:var(--accent);border-color:var(--accent)}
.ct .ctt{font:700 12px var(--mono);fill:var(--ink);text-anchor:middle}
#basics,#catalog{position:fixed;inset:0;z-index:50;background:rgba(10,16,19,.55);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
#basics[hidden],#catalog[hidden]{display:none}
.bwrap{max-width:760px;margin:0 auto}
.bhd{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.bwrap .tabs{margin:8px 0 12px}
body.noscroll{overflow:hidden}
.ver{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle;font-weight:400}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.net .sc{padding:6px 4px 8px}
.addnet{margin-top:10px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--accent);padding:10px;border-radius:8px;font-size:13.5px;cursor:pointer}

.lad{display:block}
.lad .w{stroke:var(--wire);stroke-width:2;fill:none}
.lad .pl{stroke:var(--wire);stroke-width:2.3;fill:none}
.lad .rail{stroke-width:3.5}
.live .lad .w.on{stroke:var(--on);stroke-width:2.8}
.live .lad .w:not(.on){stroke:var(--off);stroke-dasharray:5 4}
.live .lad .ct.on .pl{stroke:var(--on);stroke-width:2.8}
.live .lad .ct:not(.on) .pl{stroke:var(--off)}
.lad text{font-family:var(--mono);fill:var(--ink);text-anchor:middle}
.lad .sym{font-size:9px}
.lad .adr{font-size:8.5px;fill:var(--muted)}
.lad .err{fill:var(--err);font-weight:600}
.lad .box{fill:var(--card);stroke:var(--wire);stroke-width:1.5}
.lad .bt{font-weight:600;font-size:11px}
.lad .bs{font-size:8.5px;fill:var(--muted)}
.lad .pin{font-size:9px;text-anchor:start}
.lad .pin.r{text-anchor:end}
.lad .opd{font-size:9px;text-anchor:end;fill:var(--accent)}
.lad .val{font-size:9px;text-anchor:start;fill:var(--accent);font-weight:600}
.lad .st{stroke:var(--wire);stroke-width:1.5}
.lad .cl{font-size:11px;font-weight:600}
.lad .hit{fill:transparent;stroke:none}
.lad [data-e]{cursor:pointer}
.lad .sel .hit{fill:var(--accent2);stroke:var(--accent);stroke-width:1.5}
.lad .ph{font-size:10px;fill:var(--muted)}

/* Tags */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px}
td{padding:4px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
td:nth-child(2),td.v{font-family:var(--mono);white-space:nowrap;padding-top:7px}
td small{display:block;color:var(--muted);font-size:11.5px;padding-left:5px}
td.v.b{color:var(--off)}
td.v.b.on{color:var(--on);font-weight:600}
td.v:not(.b){color:var(--accent);font-weight:600}
.tn{width:100%;min-width:100px;border:1px solid transparent;background:transparent;color:var(--ink);font:12.5px var(--mono);padding:3px 4px;border-radius:4px}
.tn:hover{border-color:var(--line)}
.tn:focus{border-color:var(--accent);outline:none;background:var(--card)}
.tdb{font-family:var(--mono);font-size:12.5px;padding:3px 5px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:50;transition:transform .2s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}

@media (max-width:820px){
  .top{padding:12px 10px 2px}
  .layout{grid-template-columns:1fr;padding:6px 10px 16px;gap:10px}
  .side{position:static;gap:10px}
  .content{gap:10px}
  .card{padding:12px 10px}
  .tools{margin:-12px -10px 0;padding:8px 10px}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:14px 14px 0 0;border-width:1px 0 0;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18);max-height:42%;overflow-y:auto}
  .phd{margin-bottom:6px}
  .devs{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px 4px}
  .pb,.tg{height:42px}.pb{width:42px}
  .lamp{width:30px;height:30px}.mot{width:42px;height:42px}
}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div id="basics" hidden role="dialog" aria-label="Основы ПЛК"></div>
<div id="catalog" hidden role="dialog" aria-label="Задачи"></div>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 26 26"><line x1="3" y1="3" x2="3" y2="23" stroke="#3ee06a" stroke-width="2.5"/><line x1="3" y1="13" x2="9" y2="13" stroke="#3ee06a" stroke-width="2"/><line x1="10" y1="7" x2="10" y2="19" stroke="#3ee06a" stroke-width="2"/><line x1="15" y1="7" x2="15" y2="19" stroke="#3ee06a" stroke-width="2"/><line x1="16" y1="13" x2="23" y2="13" stroke="#3ee06a" stroke-width="2"/></svg>
    </div>
    <div><h1>Учебный ПЛК: пишем программу сами<span class="ver">v1.0</span></h1><p>Редактор LAD в стиле TIA Portal, симуляция S7-1200</p></div>
  </div>
  <nav id="tabs" class="tabs" aria-label="Задания"></nav>
</header>
<main class="layout">
  <aside class="side">
    <section class="cpu" id="cpu" aria-label="CPU"></section>
    <section class="panel" id="panel" aria-label="Пульт и объект"></section>
  </aside>
  <div class="content">
    <section class="card" id="task"></section>
    <section class="card" id="editor">
      <div class="tools">
        <div class="thd"><span class="blk">Main [OB1]</span><span id="status" class="status"></span></div>
        <div class="tb" role="toolbar" aria-label="Инструкции LAD">
          <button data-act="download" id="dlbtn" class="dl"><svg viewBox="0 0 30 16"><path d="M15 1v10M10 7l5 5 5-5M6 15h18"/></svg>В ПЛК</button>
          <span class="sep"></span>
          <button data-tool="NO" title="Нормально открытый контакт"><svg viewBox="0 0 30 16"><path d="M0 8h10M20 8h10M11 2v12M19 2v12"/></svg>НО</button>
          <button data-tool="NC" title="Нормально закрытый контакт"><svg viewBox="0 0 30 16"><path d="M0 8h10M20 8h10M11 2v12M19 2v12M7 14L23 2"/></svg>НЗ</button>
          <button data-tool="P" title="Контакт положительного фронта (P)"><svg viewBox="0 0 30 16"><path d="M0 8h10M20 8h10M11 2v12M19 2v12"/><text x="15" y="11.5" text-anchor="middle">P</text></svg>Фронт</button>
          <button data-tool="branch" title="Параллельная ветвь к выбранному контакту"><svg viewBox="0 0 30 16"><path d="M0 4h30M5 4v10h20V4"/></svg>Ветвь</button>
          <button data-tool="=" title="Катушка"><svg viewBox="0 0 30 16"><path d="M0 8h9M21 8h9M12 2Q7 8 12 14M18 2Q23 8 18 14"/></svg>Выход</button>
          <button data-tool="S" title="Установить (Set)"><svg viewBox="0 0 30 16"><path d="M0 8h9M21 8h9M12 2Q7 8 12 14M18 2Q23 8 18 14"/><text x="15" y="11.5" text-anchor="middle">S</text></svg>Set</button>
          <button data-tool="R" title="Сбросить (Reset)"><svg viewBox="0 0 30 16"><path d="M0 8h9M21 8h9M12 2Q7 8 12 14M18 2Q23 8 18 14"/><text x="15" y="11.5" text-anchor="middle">R</text></svg>Reset</button>
          <button data-tool="TON" title="Таймер задержки включения"><span class="bx">TON</span>таймер</button>
          <button data-tool="TOF" title="Таймер задержки отключения"><span class="bx">TOF</span>таймер</button>
          <button data-tool="CTU" title="Счётчик вверх"><span class="bx">CTU</span>счётчик</button>
          <span class="sep"></span>
          <button data-act="del" title="Удалить выбранное"><span class="bx">✕</span>Удалить</button>
          <button data-act="undo" title="Отменить"><span class="bx">↶</span>Отменить</button>
        </div>
        <div class="opbar" id="opbar"></div>
      </div>
      <div id="comp"></div>
      <div id="prog"></div>
    </section>
    <section class="card">
      <h2>Таблица тегов и наблюдение</h2>
      <p class="muted" style="margin:0 0 6px">Имена можно менять: латиница, цифры и «_». Значения обновляются онлайн.</p>
      <div class="sc"><table id="tags"></table></div>
    </section>
  </div>
</main>
<script>
const CW=66,CH=58,LY=36;
let UID=1,G={},B=[],T=null,X=null;
const nid=p=>p+(UID++);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const BASE={
 'I0.0':['Start','SB1 Пуск'],'I0.1':['Stop','SB2 Стоп'],'I0.2':['Thermal_OK','KK1 тепловое реле'],
 'I0.3':['Reset','SB3 Сброс'],'I0.4':['Sensor','B1 датчик детали'],'I0.5':['Back','SB4 Назад'],
 'Q0.0':['Motor','KM1 мотор'],'Q0.1':['Lamp_Run','HL1 Работа'],'Q0.2':['Lamp_Fault','HL2 Авария'],
 'Q0.3':['Fan','M2 вентилятор'],'Q0.4':['Lamp_Batch','HL3 Партия готова'],'Q0.5':['Motor_Back','KM2 назад'],
 'M20.5':['Clock_1Hz','тактовый меркер 1 Гц']
};
for(let i=0;i<8;i++)BASE['M0.'+i]=['Mem_'+i,'свободный меркер'];
const DEV={
 SB1:{k:'btn',name:'Пуск',w:'NO',a:'I0.0',col:'green'},
 SB2:{k:'btn',name:'Стоп',w:'NC',a:'I0.1',col:'red'},
 KK1:{k:'tog',name:'Тепл. реле',w:'NC',a:'I0.2'},
 SB3:{k:'btn',name:'Сброс',w:'NO',a:'I0.3',col:'blue'},
 B1:{k:'btn',name:'Деталь',w:'NO',a:'I0.4',col:'yellow'},
 SB4:{k:'btn',name:'Назад',w:'NO',a:'I0.5',col:'black'},
 M1:{k:'motor',name:'Мотор',a:'Q0.0'},
 HL1:{k:'lamp',name:'Работа',a:'Q0.1',col:'green'},
 HL2:{k:'lamp',name:'Авария',a:'Q0.2',col:'red'},
 M2:{k:'fan',name:'Вентилятор',a:'Q0.3'},
 HL3:{k:'lamp',name:'Партия',a:'Q0.4',col:'yellow'},
 KM2:{k:'motor',name:'Назад',a:'Q0.5',rev:true}
};
const D=id=>(T&&T.io&&T.io[id])||DEV[id];
const devKind=d=>d.k==='sens'?`датчик ${d.w==='NO'?'НО':'НЗ'}`:d.k==='tog'&&d.la?`переключатель ${d.w==='NO'?'НО':'НЗ'}`:d.k==='km'?'контактор':d.k==='horn'?'сирена':d.k==='valve'?'клапан':d.k==='btn'?`кнопка ${d.w==='NO'?'НО':'НЗ'}`:d.k==='tog'?'реле, НЗ 95-96':d.k==='lamp'?'лампа':d.k==='fan'?'вентилятор':'контактор';

/* ---------- tasks ---------- */
const start=[{pr:'SB1'}],stop=[{pr:'SB2'}];
const TASKS=[
{id:'t1',tab:'1. Лампа',name:'Кнопка и лампа',
 goal:'Лампа HL1 горит, пока нажата кнопка SB1. Отпустил — погасла.',
 devices:['SB1','HL1'],
 hint:`<p>Одна сеть: контакт НО с операндом <code>"Start"</code> %I0.0 и катушка «Выход» с операндом <code>"Lamp_Run"</code> %Q0.1.</p><p>Порядок работы: выбери инструмент, затем тапни операнд в строке под панелью. Нажми «В ПЛК», чтобы загрузить программу и проверить её кнопками на пульте.</p>`,
 tests:[{x:{'Q0.1':0},m:'Без нажатия лампа не горит'},{p:'SB1'},{x:{'Q0.1':1},m:'Пока SB1 нажата, HL1 горит'},{r:'SB1'},{x:{'Q0.1':0},m:'Отпустил SB1 — HL1 погасла'}]},
{id:'t2',tab:'2. Самоподхват',name:'Пуск/Стоп с самоподхватом',
 goal:'Короткое нажатие SB1 запускает мотор KM1, он работает до нажатия SB2. Лампа HL1 горит, пока мотор работает. Стоп важнее Пуска.',
 devices:['SB1','SB2','M1','HL1'],
 hint:`<p>SB2 подключена НЗ контактом: в покое на %I0.1 приходит 1, при нажатии 0. Подумай, какой контакт нужен в программе, чтобы цепь была замкнута, пока Стоп не трогают.</p><p>Самоподхват: выбери контакт Пуск и нажми «Ветвь». В новую ветвь поставь контакт самого выхода %Q0.0. Лампу можно добавить второй катушкой в той же сети: выбери катушку и нажми «Выход».</p>`,
 tests:[{x:{'Q0.0':0},m:'В исходном состоянии мотор стоит'},...start,{x:{'Q0.0':1},m:'После короткого нажатия Пуск мотор работает (самоподхват)'},{x:{'Q0.1':1},m:'Лампа Работа горит вместе с мотором'},{p:'SB2'},{x:{'Q0.0':0,'Q0.1':0},m:'Стоп останавливает мотор и гасит лампу'},{r:'SB2'},{x:{'Q0.0':0},m:'После отпускания Стоп мотор сам не запускается'},{p:'SB2'},{p:'SB1'},{x:{'Q0.0':0},m:'При одновременном нажатии Пуск и Стоп мотор не работает'},{r:'SB1'},{r:'SB2'}]},
{id:'t3',tab:'3. Авария',name:'Тепловая защита и квитирование',
 goal:'Срабатывание теплового реле KK1 останавливает мотор и включает лампу HL2 (можно мигающую). Авария запоминается: после возврата реле мотор нельзя запустить, пока не нажат SB3 «Сброс». Сброс работает только когда KK1 в норме.',
 devices:['SB1','SB2','KK1','SB3','M1','HL1','HL2'],
 hint:`<p>Запоминание делают парой катушек «Set» и «Reset» на свободный меркер, например <code>%M0.0</code>. Переименуй его в таблице тегов в <code>Fault</code>.</p><p>KK1 подключено НЗ 95-96: в норме %I0.2 = 1, при срабатывании 0.</p><p>Для мигания поставь последовательно с аварией тактовый меркер <code>"Clock_1Hz"</code> %M20.5.</p><p>Порядок сетей важен: OB1 выполняется сверху вниз каждый цикл.</p>`,
 tests:[...start,{x:{'Q0.0':1},m:'Мотор запускается'},{t:'KK1'},{x:{'Q0.0':0},m:'Срабатывание KK1 останавливает мотор'},{see:'Q0.2',in:1200,m:'Лампа Авария горит или мигает'},{t:'KK1'},{see:'Q0.2',in:1200,m:'После возврата KK1 авария держится до квитирования'},...start,{x:{'Q0.0':0},m:'Пока авария не сброшена, пуск невозможен'},{t:'KK1'},{pr:'SB3'},{see:'Q0.2',in:1200,m:'Сброс не действует, пока KK1 сработало'},{t:'KK1'},{pr:'SB3'},{never:'Q0.2',in:1200,m:'После квитирования лампа Авария гаснет'},...start,{x:{'Q0.0':1},m:'После сброса мотор снова запускается'}]},
{id:'t4',tab:'4. TON',name:'Задержка включения TON',
 goal:'Вентилятор M2 (%Q0.3) включается через 3 с после пуска мотора и выключается сразу, когда мотор остановлен.',
 devices:['SB1','SB2','M1','M2'],
 hint:`<p>Первая сеть — мотор с самоподхватом. Во второй сети: контакт <code>%Q0.0</code>, блок TON, справа катушка вентилятора. Выбери блок и задай PT = 3 с.</p><p>TON сбрасывается, как только вход пропадает, поэтому короткий пуск меньше 3 с вентилятор не включит.</p>`,
 tests:[...start,{w:2500},{x:{'Q0.0':1,'Q0.3':0},m:'Через 2,5 с после пуска вентилятор ещё выключен'},{w:800},{x:{'Q0.3':1},m:'Через 3 с после пуска вентилятор включён'},...stop,{x:{'Q0.3':0},m:'После Стоп вентилятор сразу выключается'},...start,{w:2000},...stop,{never:'Q0.3',in:4000,m:'Короткий пуск меньше 3 с вентилятор не включает'}]},
{id:'t5',tab:'5. TOF',name:'Выбег вентилятора TOF',
 goal:'Вентилятор включается сразу вместе с мотором, а после останова мотора работает ещё 5 с.',
 devices:['SB1','SB2','M1','M2'],
 hint:`<p>TOF: выход Q = 1 сразу вместе со входом IN, а после пропадания входа держится ещё время PT. Нужен один блок между контактом мотора и катушкой вентилятора.</p>`,
 tests:[...start,{x:{'Q0.3':1},m:'Вентилятор включается сразу с мотором'},...stop,{x:{'Q0.0':0},m:'Мотор остановился'},{w:4500},{x:{'Q0.3':1},m:'Через 4,5 с после Стоп вентилятор ещё работает'},{w:800},{x:{'Q0.3':0},m:'Через 5 с вентилятор отключился'}]},
{id:'t6',tab:'6. Счётчик',name:'Счётчик партии CTU',motor:'Конвейер',tagOv:{'Q0.0':'Conveyor'},
 goal:'Датчик B1 считает детали, но только пока конвейер работает. После 5-й детали конвейер останавливается и загорается HL3. При готовой партии пуск невозможен. SB3 обнуляет счётчик.',
 devices:['SB1','SB2','B1','SB3','M1','HL3'],
 hint:`<p>CTU считает фронты 0 → 1 на входе CU. Перед блоком поставь датчик <code>%I0.4</code> и контакт конвейера <code>%Q0.0</code>, задай PV = 5, на вход R выбери <code>"Reset"</code> %I0.3.</p><p>Выход Q счётчика запиши в меркер и поставь этот меркер НЗ контактом в цепь пуска конвейера.</p>`,
 tests:[...start,{pr:'B1'},{pr:'B1'},{pr:'B1'},{pr:'B1'},{x:{'Q0.0':1,'Q0.4':0},m:'После 4 деталей конвейер работает'},{pr:'B1'},{x:{'Q0.0':0},m:'После 5-й детали конвейер остановился'},{x:{'Q0.4':1},m:'HL3 «Партия готова» горит'},...start,{x:{'Q0.0':0},m:'При готовой партии пуск невозможен'},{pr:'SB3'},{x:{'Q0.4':0},m:'SB3 сбрасывает партию'},...start,{x:{'Q0.0':1},m:'После сброса конвейер запускается'},...stop,{pr:'B1'},{pr:'B1'},{pr:'B1'},{pr:'B1'},{pr:'B1'},...start,{x:{'Q0.0':1,'Q0.4':0},m:'Детали при остановленном конвейере не считаются'}]},
{id:'t7',tab:'7. Реверс',name:'Реверс с блокировкой',tagOv:{'I0.0':'Fwd','Q0.0':'Motor_Fwd'},names:{SB1:'Вперёд',M1:'Вперёд'},
 goal:'SB1 включает вращение вперёд (KM1, %Q0.0), SB4 — назад (KM2, %Q0.5), SB2 останавливает. Пока мотор крутится в одну сторону, другую включить нельзя, сначала Стоп.',
 devices:['SB1','SB4','SB2','M1','KM2'],
 hint:`<p>Две сети, каждая с самоподхватом. В цепь каждого контактора добавь НЗ контакт другого контактора. Это программная блокировка, такая же, как блок-контакты в силовой схеме реверса.</p>`,
 tests:[...start,{x:{'Q0.0':1,'Q0.5':0},m:'SB1 запускает вращение вперёд'},{pr:'SB4'},{x:{'Q0.5':0},m:'При вращении вперёд SB4 не включает KM2'},{x:{'Q0.0':1},m:'KM1 продолжает работать'},...stop,{x:{'Q0.0':0},m:'Стоп останавливает'},{pr:'SB4'},{x:{'Q0.5':1,'Q0.0':0},m:'SB4 запускает вращение назад'},...start,{x:{'Q0.0':0},m:'При вращении назад SB1 не включает KM1'},...stop,{x:{'Q0.5':0},m:'Стоп останавливает и назад'}]},
{id:'sb',tab:'Песочница',name:'Песочница',
 goal:'Свободный режим: все входы и выходы, без проверки. Пиши что угодно.',
 devices:['SB1','SB2','KK1','SB3','B1','SB4','M1','HL1','HL2','M2','HL3','KM2']}
];

/* ---------- state & storage ---------- */
const S={run:true,mon:true,bits:{},dev:{},inst:{},now:0,prog:[],loaded:[],dirty:false,sel:null,hist:[],custom:{},comp:null,report:null,pmin:false,ti:0,view:'task',basics:false,bi:0,catOpen:false,catF:-1,pl:null};
const LS='plc-lad-editor-v1';
let STORE={};try{STORE=JSON.parse(localStorage.getItem(LS))||{};}catch(e){STORE={};}
const strip=(k,v)=>k[0]==='_'?undefined:v;
const clone=o=>JSON.parse(JSON.stringify(o,strip));
function save(){try{STORE[T.id]={prog:JSON.parse(JSON.stringify(S.prog,strip)),names:S.custom,passed:!!(STORE[T.id]&&STORE[T.id].passed)||!!S.passed,lesson:!!(STORE[T.id]&&STORE[T.id].lesson)};localStorage.setItem(LS,JSON.stringify(STORE));}catch(e){}}
const devTag=a=>{if(!T.io)return null;for(const k in T.io)if(T.io[k].a===a)return T.io[k].t;return null;};
const nameOf=a=>S.custom[a]||(T.tagOv&&T.tagOv[a])||devTag(a)||(BASE[a]?BASE[a][0]:a);
const cmtOf=a=>{const id=T.devices.find(d=>D(d).a===a);if(id){const d=D(id);return`${id} ${(T.names&&T.names[id])||d.name}, ${devKind(d)}`;}return BASE[a]?BASE[a][1]:'';};
function tagList(){const s=new Set();T.devices.forEach(id=>{if(D(id).a)s.add(D(id).a);});for(let i=0;i<8;i++)s.add('M0.'+i);s.add('M20.5');
 const ord={I:0,Q:1,M:2};return[...s].sort((a,b)=>{if(a[0]!==b[0])return ord[a[0]]-ord[b[0]];const[x1,y1]=a.slice(1).split('.').map(Number),[x2,y2]=b.slice(1).split('.').map(Number);return x1-x2||y1-y2;});}
const newNet=()=>({id:nid('n'),items:[],coils:[]});

/* ---------- PLC engine ---------- */
const gb=a=>!!(a&&X.bits[a]);
function box(e,pin){
 const st=X.inst[e.name]||(X.inst[e.name]={et:0,q:false,run:false,t0:0,cv:0,prev:false});
 const now=X.now;
 if(e.type==='TON'){
  if(pin){if(!st.run){st.run=true;st.t0=now;}st.et=Math.min(now-st.t0,e.pt);st.q=st.et>=e.pt;}
  else{st.run=false;st.et=0;st.q=false;}
 }else if(e.type==='TOF'){
  if(pin){st.q=true;st.et=0;st.run=false;}
  else if(st.q){if(!st.run){st.run=true;st.t0=now;}st.et=Math.min(now-st.t0,e.pt);if(st.et>=e.pt){st.q=false;st.run=false;}}
 }else{
  if(gb(e.r))st.cv=0;else if(pin&&!st.prev)st.cv=Math.min(st.cv+1,32767);
  st.prev=pin;st.q=st.cv>=e.pv;
 }
 return st.q;
}
function evL(l,pin){let p=pin;for(const it of l)p=evI(it,p);return p;}
function evI(e,pin){
 e._in=pin;
 if(e.k==='c'){const v=gb(e.tag);if(e.t==='P'||e.t==='N'){const k='_e'+e.id,pv=!!X.inst[k];e._cl=e.t==='P'?v&&!pv:!v&&pv;X.inst[k]=v;}else e._cl=e.t==='NO'?v:!v;e._out=pin&&e._cl;}
 else if(e.k==='b')e._out=box(e,pin);
 else if(e.k==='p'){let o=false;for(const b of e.br)o=evL(b,pin)||o;e._out=o;}
 return e._out;
}
function clrL(l){for(const e of l){e._in=e._out=e._cl=false;if(e.br)e.br.forEach(clrL);}}
function scanCtx(c,nets,devs){
 X=c;
 if(c.pl&&T.plant){const dt=Math.min(0.1,Math.max(0,(c.now-(c._pt??c.now))/1000));T.plant.step(c,dt);}c._pt=c.now;
 for(const id of devs){const d=D(id);if(!d.a||d.a[0]!=='I')continue;const act=!!c.dev[id];c.bits[d.a]=d.w==='NO'?act:!act;}
 c.bits['M20.5']=Math.floor(c.now/500)%2===0;
 if(c.run){
  for(const n of nets){const r=evL(n.items,true);n._out=r;for(const q of n.coils){if(!q.tag)continue;if(q.t==='=')c.bits[q.tag]=r;else if(r)c.bits[q.tag]=q.t==='S';}}
 }else{
  for(const k in c.bits)if(k[0]==='Q')c.bits[k]=false;
  for(const n of nets){clrL(n.items);n._out=false;}
 }
}
function scan(){S.now=performance.now();scanCtx(S,S.dirty?S.loaded:S.prog,T.devices);paint();}

/* ---------- LAD rendering ---------- */
function grp(k){B=G[k]=[];}
function wire(x1,y1,x2,y2,fn,cls=''){const id=nid('w');B.push({id,fn});return`<line id="${id}" class="w ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
function lbl(xc,y,a){if(!a)return`<text class="err" x="${xc}" y="${y+16}">&lt;??.?&gt;</text>`;return`<text class="sym" x="${xc}" y="${y+11}">"${esc(nameOf(a))}"</text><text class="adr" x="${xc}" y="${y+22}">%${a}</text>`;}
function natL(l){if(!l.length)return{w:1,h:1};const s=l.map(natI);return{w:s.reduce((a,b)=>a+b.w,0),h:Math.max(...s.map(b=>b.h))};}
function natI(e){if(e.k==='c')return{w:1,h:1};if(e.k==='b')return{w:2,h:e.type==='CTU'?3:2};const s=e.br.map(natL);return{w:Math.max(...s.map(b=>b.w)),h:s.reduce((a,b)=>a+b.h,0)};}
const isSel=e=>S.sel&&S.sel.id===e.id;
function drawL(l,x,y,W,pin){
 if(!l.length)return wire(x,y+LY,x+W*CW,y+LY,pin);
 let s='',cx=x;
 for(const it of l){const n=natI(it);s+=drawI(it,cx,y,n);cx+=n.w*CW;}
 const last=l[l.length-1];
 if(cx<x+W*CW)s+=wire(cx,y+LY,x+W*CW,y+LY,()=>last._out);
 return s;
}
function drawI(e,x,y,n){
 let s='';const ly=y+LY;
 if(e.k==='c'){
  s+=wire(x,ly,x+24,ly,()=>e._in)+wire(x+42,ly,x+CW,ly,()=>e._out);
  const id=nid('g');B.push({id,fn:()=>e._cl});
  s+=`<g id="${id}" class="ct ${isSel(e)?'sel':''}" data-e="${e.id}" tabindex="0" role="button" aria-label="Контакт ${({NO:'НО',NC:'НЗ',P:'фронт P',N:'фронт N'})[e.t]} ${e.tag||'без операнда'}"><rect class="hit" x="${x+2}" y="${y+1}" width="${CW-4}" height="${CH-2}" rx="4"/><line class="pl" x1="${x+24}" y1="${ly-11}" x2="${x+24}" y2="${ly+11}"/><line class="pl" x1="${x+42}" y1="${ly-11}" x2="${x+42}" y2="${ly+11}"/>${e.t==='NC'?`<line class="pl" x1="${x+18}" y1="${ly+11}" x2="${x+48}" y2="${ly-11}"/>`:''}${e.t==='P'||e.t==='N'?`<text class="ctt" x="${x+33}" y="${ly+4}">${e.t}</text>`:''}${lbl(x+CW/2,y,e.tag)}</g>`;
 }else if(e.k==='p'){
  let yy=y,last=y;
  for(const b of e.br){last=yy;s+=drawL(b,x,yy,n.w,()=>e._in);yy+=natL(b).h*CH;}
  s+=wire(x,ly,x,last+LY,()=>e._in)+wire(x+n.w*CW,ly,x+n.w*CW,last+LY,()=>e._out);
  s+=`<g class="${isSel(e)?'sel':''}" data-e="${e.id}" tabindex="0" role="button" aria-label="Параллельная группа"><rect class="hit" x="${x+n.w*CW-11}" y="${ly-14}" width="22" height="${last-y+28}" rx="6"/></g>`;
 }else{
  const h=n.h,bx=x+30,bw=2*CW-54,bt=y+16,bb=y+h*CH-6,cxm=bx+bw/2,p1=ly+34,p2=ly+64;
  const st=()=>S.inst[e.name]||{et:0,cv:0};
  s+=wire(x,ly,bx,ly,()=>e._in)+wire(bx+bw,ly,x+2*CW,ly,()=>e._out);
  let inner=`<rect class="hit" x="${x+2}" y="${y+1}" width="${2*CW-4}" height="${h*CH-2}" rx="4"/><text class="sym" x="${cxm}" y="${y+11}">"${e.name}"</text><rect class="box" x="${bx}" y="${bt}" width="${bw}" height="${bb-bt}" rx="2"/><text class="bt" x="${cxm}" y="${bt+13}">${e.type}</text><text class="bs" x="${cxm}" y="${bt+24}">${e.type==='CTU'?'Int':'Time'}</text><text class="pin" x="${bx+4}" y="${ly+3}">${e.type==='CTU'?'CU':'IN'}</text><text class="pin r" x="${bx+bw-4}" y="${ly+3}">Q</text>`;
  const lp=(yy,nm,op,bad)=>`<line class="st" x1="${bx-6}" y1="${yy}" x2="${bx}" y2="${yy}"/><text class="pin" x="${bx+4}" y="${yy+3}">${nm}</text><text class="opd ${bad?'err':''}" x="${bx-8}" y="${yy+3}">${op}</text>`;
  const rp=(yy,nm,fn)=>{const id=nid('t');B.push({id,txt:fn});return`<line class="st" x1="${bx+bw}" y1="${yy}" x2="${bx+bw+6}" y2="${yy}"/><text class="pin r" x="${bx+bw-4}" y="${yy+3}">${nm}</text><text class="val" id="${id}" x="${bx+bw+8}" y="${yy+3}"></text>`;};
  if(e.type==='CTU')inner+=lp(p1,'R',e.r?'%'+e.r:'&lt;??.?&gt;',!e.r)+lp(p2,'PV',String(e.pv))+rp(p1,'CV',()=>String(st().cv));
  else inner+=lp(p1,'PT',fmtT(e.pt))+rp(p1,'ET',()=>fmtT(st().et));
  s+=`<g class="${isSel(e)?'sel':''}" data-e="${e.id}" tabindex="0" role="button" aria-label="Блок ${e.type}">${inner}</g>`;
 }
 return s;
}
function hasBox(l){return l.some(e=>e.k==='b'||(e.br&&e.br.some(hasBox)));}
function netSVG(n){
 const ln=natL(n.items),X0=4,lw=Math.max(ln.w,2)+(hasBox(n.items)?1:0),cx=X0+lw*CW;
 const rows=Math.max(ln.h,n.coils.length||1),H=rows*CH+4,W=cx+82;
 let s=wire(2,0,2,H,()=>S.run,'rail');
 s+=drawL(n.items,X0,0,lw,()=>S.run);
 const out=()=>n._out;
 if(!n.coils.length){s+=wire(cx,LY,cx+12,LY,out)+`<text class="ph" x="${cx+44}" y="${LY+4}">нет выхода</text>`;}
 n.coils.forEach((c,j)=>{
  const ly=j*CH+LY;
  s+=j===0?wire(cx,ly,cx+12,ly,out):wire(cx+12,ly-CH,cx+12,ly,out);
  s+=wire(cx+12,ly,cx+28,ly,out);
  const id=nid('k');B.push({id,fn:out});
  s+=`<g id="${id}" class="ct ${isSel(c)?'sel':''}" data-e="${c.id}" tabindex="0" role="button" aria-label="Катушка ${c.t} ${c.tag||'без операнда'}"><rect class="hit" x="${cx+10}" y="${j*CH+1}" width="${70}" height="${CH-2}" rx="4"/><path class="pl" d="M${cx+33} ${ly-11} Q${cx+26} ${ly} ${cx+33} ${ly+11}"/><path class="pl" d="M${cx+53} ${ly-11} Q${cx+60} ${ly} ${cx+53} ${ly+11}"/>${c.t!=='='?`<text class="cl" x="${cx+43}" y="${ly+4}">${c.t}</text>`:''}${lbl(cx+43,j*CH,c.tag)}</g>`;
 });
 return`<svg class="lad" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
const fmtT=ms=>{ms=Math.round(ms/10)*10;const s=Math.floor(ms/1000),r=ms%1000;if(!s)return`T#${r}MS`;return r?`T#${s}S_${r}MS`:`T#${s}S`;};

/* ---------- editing ---------- */
function locate(id){
 for(let ni=0;ni<S.prog.length;ni++){const net=S.prog[ni];
  for(let i=0;i<net.items.length;i++){const it=net.items[i];
   if(it.id===id)return{net,ni,list:net.items,idx:i,el:it};
   if(it.k==='p')for(let bi=0;bi<it.br.length;bi++){const b=it.br[bi];for(let j=0;j<b.length;j++)if(b[j].id===id)return{net,ni,list:b,idx:j,el:b[j],par:it,bi,pidx:i};}
  }
  for(let i=0;i<net.coils.length;i++)if(net.coils[i].id===id)return{net,ni,list:net.coils,idx:i,el:net.coils[i],coil:true};
 }
 return null;
}
function walkAll(fn){const w=l=>l.forEach(e=>{fn(e);if(e.br)e.br.forEach(w);});S.prog.forEach(n=>{w(n.items);n.coils.forEach(fn);});}
function boxName(type){const pre=type==='CTU'?'IEC_Counter_':'IEC_Timer_';const used=new Set();walkAll(e=>{if(e.k==='b')used.add(e.name);});let n=0;while(used.has(pre+n+'_DB'))n++;return pre+n+'_DB';}
function targetNet(){
 if(S.sel){if(S.sel.net){const n=S.prog.find(n=>n.id===S.sel.net);if(n)return n;}else{const L=locate(S.sel.id);if(L)return L.net;}}
 return S.prog[S.prog.length-1];
}
function edit(fn){
 S.hist.push(JSON.stringify(S.prog,strip));if(S.hist.length>60)S.hist.shift();
 fn();S.dirty=true;S.comp=null;save();renderProg();renderTags();
}
function addItem(el){
 edit(()=>{
  const L=S.sel&&S.sel.id?locate(S.sel.id):null;
  if(L&&!L.coil){if(el.k==='b'&&L.par)L.net.items.splice(L.pidx+1,0,el);else L.list.splice(L.idx+1,0,el);}
  else targetNet().items.push(el);
  S.sel={id:el.id};
 });
}
function addCoil(t){
 edit(()=>{
  const el={k:'q',t,tag:null,id:nid('e')};
  const L=S.sel&&S.sel.id?locate(S.sel.id):null;
  if(L&&L.coil)L.list.splice(L.idx+1,0,el);else targetNet().coils.push(el);
  S.sel={id:el.id};
 });
}
function addBranch(){
 const L=S.sel&&S.sel.id?locate(S.sel.id):null;
 if(L&&L.el.k==='p'){edit(()=>{const nc={k:'c',t:'NO',tag:null,id:nid('e')};L.el.br.push([nc]);S.sel={id:nc.id};});return;}
 if(!L||L.coil||L.el.k!=='c'){toast('Выбери контакт, параллельно которому нужна ветвь');return;}
 edit(()=>{
  const nc={k:'c',t:'NO',tag:null,id:nid('e')};
  if(L.par)L.par.br.push([nc]);
  else L.list.splice(L.idx,1,{k:'p',id:nid('e'),br:[[L.el],[nc]]});
  S.sel={id:nc.id};
 });
}
function del(){
 if(!S.sel){toast('Сначала выбери элемент или сеть');return;}
 if(S.sel.net){edit(()=>{const i=S.prog.findIndex(n=>n.id===S.sel.net);if(i>=0)S.prog.splice(i,1);if(!S.prog.length)S.prog.push(newNet());S.sel=null;});return;}
 const L=locate(S.sel.id);if(!L)return;
 edit(()=>{
  L.list.splice(L.idx,1);
  if(L.par){if(!L.list.length)L.par.br.splice(L.bi,1);if(L.par.br.length===1)L.net.items.splice(L.pidx,1,...L.par.br[0]);}
  S.sel={net:L.net.id};
 });
}
function undo(){
 if(!S.hist.length){toast('Нечего отменять');return;}
 S.prog=JSON.parse(S.hist.pop());S.sel=null;S.dirty=true;S.comp=null;save();renderProg();renderTags();
}
function tool(t){
 if(t==='NO'||t==='NC'||t==='P')addItem({k:'c',t,tag:null,id:nid('e')});
 else if(t==='='||t==='S'||t==='R')addCoil(t);
 else if(t==='branch')addBranch();
 else addItem({k:'b',type:t,id:nid('e'),name:boxName(t),pt:t==='TON'?3000:5000,pv:5,r:null});
}

/* ---------- compile / download / test ---------- */
function compile(){
 const out=[],assign={};
 const wl=(l,fn)=>l.forEach(e=>{fn(e);if(e.br)e.br.forEach(b=>wl(b,fn));});
 S.prog.forEach((n,i)=>{
  const N=`Сеть ${i+1}`;
  if(!n.items.length&&!n.coils.length){out.push({e:1,m:`${N}: пустая сеть. Удали её или заполни`});return;}
  if(!n.coils.length)out.push({e:1,m:`${N}: нет катушки на выходе`});
  if(!n.items.length)out.push({e:1,m:`${N}: перед катушкой нет ни одного условия`});
  let miss=0;
  wl(n.items,e=>{if(e.k==='c'&&!e.tag)miss++;if(e.k==='b'&&e.type==='CTU'&&!e.r)out.push({e:1,m:`${N}: у счётчика не задан вход R`});if(e.k==='b'&&e.type!=='CTU'&&!(e.pt>0))out.push({e:1,m:`${N}: у таймера не задано время PT`});});
  n.coils.forEach(q=>{if(!q.tag)miss++;else if(q.t==='=')(assign[q.tag]=assign[q.tag]||[]).push(i+1);});
  if(miss)out.push({e:1,m:`${N}: не задан операнд у элементов: ${miss} (красные <??.?>)`});
 });
 for(const a in assign)if(assign[a].length>1)out.push({e:0,m:`%${a} "${nameOf(a)}" присваивается в сетях ${assign[a].join(', ')}. Сработает только последняя сеть: двойное присваивание`});
 return out;
}
function download(){
 const r=compile();S.comp=r;const errs=r.filter(x=>x.e).length;
 if(errs){toast(`Ошибок компиляции: ${errs}. Загрузка отменена`);renderProg();return;}
 S.loaded=clone(S.prog);S.dirty=false;
 for(const k in S.bits)if(k[0]==='M'&&k!=='M20.5')delete S.bits[k];
 S.inst={};
 toast(r.length?`Загружено в ПЛК. Предупреждений: ${r.length}`:'Загружено в ПЛК');
 renderProg();renderTags();
}
function runTests(){
 const r=compile();
 if(r.some(x=>x.e)){S.comp=r;S.report={fail:true,title:'Сначала исправь ошибки компиляции',res:[]};renderProg();renderReport();return;}
 const nets=clone(S.prog),c={bits:{},inst:{},now:0,dev:{},run:true,pl:T.plant?T.plant.init():null};
 const step=()=>{c.now+=10;scanCtx(c,nets,T.devices);};
 const n=k=>{for(let i=0;i<k;i++)step();};
 n(5);
 const res=[];let failed=false;
 for(const s of T.tests){
  if(failed){if(s.m)res.push({skip:true,m:s.m});continue;}
  if(s.p){c.dev[s.p]=true;n(4);}
  else if(s.r){c.dev[s.r]=false;n(4);}
  else if(s.pr){c.dev[s.pr]=true;n(4);c.dev[s.pr]=false;n(4);}
  else if(s.t){c.dev[s.t]=!c.dev[s.t];n(4);}
  else if(s.w){n(Math.round(s.w/10));}
  else if(s.x){const ok=Object.entries(s.x).every(([a,v])=>!!c.bits[a]===!!v);res.push({ok,m:s.m});if(!ok)failed=true;}
  else if(s.see){let seen=false;for(let i=0;i<s.in/10;i++){step();if(c.bits[s.see])seen=true;}res.push({ok:seen,m:s.m});if(!seen)failed=true;}
  else if(s.set){Object.assign(c.pl,s.set);n(2);}
  else if(s.xs){const ok=!!s.xs(c.pl,c);res.push({ok,m:s.m});if(!ok)failed=true;}
  else if(s.until||s.stay||s.blink||s.nb){const mt=o=>Object.entries(o).every(([a,v])=>!!c.bits[a]===!!v);let ok=s.until?false:true,on=false,off=false;
   for(let i=0;i<s.in/10;i++){step();if(s.until&&mt(s.until)){ok=true;break;}if(s.stay&&!mt(s.stay))ok=false;if(s.blink){if(c.bits[s.blink])on=true;else off=true;}if(s.nb&&c.bits[s.nb[0]]&&c.bits[s.nb[1]])ok=false;}
   if(s.blink)ok=on&&off;res.push({ok,m:s.m});if(!ok)failed=true;}
  else if(s.never){let seen=false;for(let i=0;i<s.in/10;i++){step();if(c.bits[s.never])seen=true;}res.push({ok:!seen,m:s.m});if(seen)failed=true;}
 }
 if(!failed&&T.plant)for(const[k,m]of T.plant.checks){const ok=!c.pl[k];res.push({ok,m});if(!ok)failed=true;}
 X=S;
 const okN=res.filter(x=>x.ok).length,tot=res.length;
 S.report={fail:failed,title:failed?`Проверка не пройдена: ${okN} из ${tot}`:`Задание выполнено: ${tot} из ${tot}`,res};
 if(!failed){S.passed=true;save();renderTabs();}
 renderReport();
}

function mini(spec){
 const U=100,BW=100,RH=50,Y0=34;
 const wL=l=>l.reduce((a,e)=>a+wE(e),0)||U;
 const isC=t=>t==='NO'||t==='NC'||t==='P'||t==='N';
 const wE=e=>e[0]==='PAR'?Math.max(...e[1].map(wL)):(isC(e[0])?U:BW);
 const hL=l=>Math.max(1,...l.map(e=>e[0]==='PAR'?e[1].reduce((a,b)=>a+hL(b),0):1));
 let s='';
 const ln=(a,b,c,d)=>{s+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;};
 const tx=(x,y,t,c='')=>{s+=`<text x="${x}" y="${y}" class="${c}">${t}</text>`;};
 const dL=(l,x0,y,W)=>{let x=x0;for(const e of l){const w=wE(e);dE(e,x,y,w);x+=w;}if(x<x0+W)ln(x,y,x0+W,y);};
 const dE=(e,x,y,w)=>{
  if(isC(e[0])){if(e[0]==='P'||e[0]==='N')tx(x+50,y+4,e[0],'b');ln(x,y,x+41,y);ln(x+41,y-10,x+41,y+10);ln(x+59,y-10,x+59,y+10);ln(x+59,y,x+w,y);if(e[0]==='NC')ln(x+37,y+12,x+63,y-12);tx(x+50,y-15,e[1]);return;}
  if(e[0]==='PAR'){let yy=y;e[1].forEach((b,i)=>{dL(b,x,yy,w);if(i){ln(x,y,x,yy);ln(x+w,y,x+w,yy);}yy+=hL(b)*RH;});return;}
  ln(x,y,x+12,y);s+=`<rect x="${x+12}" y="${y-14}" width="${w-24}" height="42" rx="3"/>`;tx(x+w/2,y-1,e[0],'b');tx(x+w/2,y+18,e[1],'s');ln(x+w-12,y,x+w,y);
 };
 const W=wL(spec.s),H=Math.max(hL(spec.s),(spec.c||[]).length)*RH+14,cx=4+W+18;
 ln(2,4,2,H-4);dL(spec.s,4,Y0,W);ln(4+W,Y0,cx,Y0);
 (spec.c||[]).forEach((c,j)=>{const y=Y0+j*RH;if(j)ln(cx,y-RH,cx,y);ln(cx,y,cx+24,y);s+=`<path d="M${cx+30} ${y-10}Q${cx+23} ${y} ${cx+30} ${y+10}M${cx+46} ${y-10}Q${cx+53} ${y} ${cx+46} ${y+10}"/>`;if(c[0]!=='=')tx(cx+38,y+4,c[0],'b');tx(cx+38,y-15,c[1]);});
 const SW=cx+86;
 return`<div class="lmini"><svg viewBox="0 0 ${SW} ${H}" width="${SW}" height="${H}">${s}</svg></div>`;
}
const BASICS=[
{id:'b1',title:'Что такое ПЛК',html:`<p><b>ПЛК</b> (программируемый логический контроллер) — промышленный компьютер, который управляет оборудованием по программе. Вместо десятков реле и проводов логику пишут программой, и её можно поменять, не перебирая шкаф.</p>
<p>К <b>входам</b> ПЛК подключают то, что сообщает о состоянии объекта: кнопки, концевики, датчики, контакты реле. К <b>выходам</b> — то, чем он управляет: катушки контакторов, лампы, клапаны.</p>
<p>В этом приложении симулируется <b>S7-1200, CPU 1214C DC/DC/DC</b>: питание 24 В DC, 14 дискретных входов и 10 транзисторных выходов на 24 В. Программа пишется на языке <b>LAD</b> (релейная логика) — он выглядит как электрическая схема, повёрнутая на бок.</p>
<p>У CPU два режима: <b>RUN</b> — программа выполняется, <b>STOP</b> — выполнение остановлено, все выходы выключены.</p>`,
quiz:[{q:'Куда подключают кнопку «Пуск»?',o:['На вход ПЛК','На выход ПЛК','На питание 24 В'],a:0,e:'Кнопка сообщает ПЛК о действии оператора, значит это вход (%I).'},
{q:'Что происходит с выходами в режиме STOP?',o:['Остаются как были','Выключаются','Включаются все'],a:1,e:'В STOP программа не выполняется, и выходы S7-1200 по умолчанию переходят в 0.'}]},
{id:'b2',title:'Цикл ПЛК',html:`<p>ПЛК выполняет программу не один раз, а по кругу, тысячи раз в минуту. Один круг называется <b>циклом сканирования</b>:</p>
<ol><li>Считать все входы и запомнить их в <b>образ входов</b> (PII).</li><li>Выполнить программу OB1 <b>сверху вниз</b>, сеть за сетью. Результаты пишутся в <b>образ выходов</b> (PIQ).</li><li>Передать образ выходов на физические выходы.</li></ol>
<p>Здесь цикл 30 мс. Из этого следуют два важных правила:</p>
<p><b>1. Порядок сетей имеет значение.</b> Сеть ниже видит то, что записала сеть выше в этом же цикле.</p>
<p><b>2. Последняя запись побеждает.</b> Если один выход пишут две сети, на клемму уйдёт результат нижней. Поэтому каждую катушку «Выход» ставят в программе только один раз.</p>`,
quiz:[{q:'Выход %Q0.0 написан катушкой в сети 1 (результат 1) и в сети 3 (результат 0). Что на клемме?',o:['1','0','Мигает'],a:1,e:'Сети выполняются сверху вниз, физический выход получает значение после всей программы — это 0 из сети 3.'},
{q:'Когда ПЛК читает состояние кнопок?',o:['В начале каждого цикла','Один раз при включении','Когда кнопку нажали'],a:0,e:'Входы считываются в образ входов в начале каждого цикла, и вся программа работает с этой копией.'}]},
{id:'b3',title:'Адреса и теги',html:`<p>Каждый сигнал имеет <b>адрес</b> вида <code>%I0.0</code>: область, номер байта, точка, номер бита (0–7).</p>
<p><code>%I</code> — входы, <code>%Q</code> — выходы, <code>%M</code> — <b>меркеры</b>: внутренние биты памяти, к которым ничего не подключено. В них хранят промежуточные результаты, например «авария запомнена».</p>
<p>Чтобы не держать адреса в голове, им дают <b>символьные имена — теги</b>: <code>%I0.0</code> = <code>"Start"</code>, <code>%Q0.0</code> = <code>"Motor"</code>. В TIA Portal имя пишется в кавычках, адрес — с %. Переименовать теги можно в таблице тегов под редактором.</p>
<p>Меркер <code>%M20.5</code> = <code>"Clock_1Hz"</code> — <b>тактовый меркер</b>: сам переключается раз в 0,5 с, то есть мигает с частотой 1 Гц. В настоящем CPU его включают в свойствах (Clock memory byte).</p>`,
quiz:[{q:'Что такое %M0.0?',o:['Вход','Выход','Внутренний бит памяти'],a:2,e:'Область M — меркеры, внутренняя память ПЛК без клемм.'},
{q:'Сколько бит в одном байте адреса, например %I0.x?',o:['8 (0–7)','10 (0–9)','16'],a:0,e:'Номер бита — от 0 до 7, после %I0.7 идёт %I1.0.'}]},
{id:'b4',title:'Контакты и катушки',html:`<p>Сеть LAD читается слева направо. Слева — <b>шина питания</b>, от неё «ток» течёт через контакты к катушке справа.</p>
${mini({s:[['NO','"Start"'],['NC','"Stop"']],c:[['=','"Motor"']]})}
<p><b>Контакт НО</b> (—| |—) пропускает ток, когда бит операнда = <b>1</b>.<br><b>Контакт НЗ</b> (—|/|—) пропускает ток, когда бит = <b>0</b>.<br><b>Катушка</b> (—( )—) записывает в свой бит 1, если до неё дошёл ток, и 0, если нет.</p>
<p>Контакты <b>последовательно</b> — это И: нужны оба. <b>Параллельно</b> (ветвь) — это ИЛИ: хватит любого.</p>
${mini({s:[['PAR',[[['NO','"A"']],[['NO','"B"']]]]],c:[['=','"Lamp"']]})}
<p><b>Главная ловушка:</b> тип контакта в программе не связан с тем, какой контакт у кнопки в шкафу. Контакт в программе лишь проверяет бит: 1 или 0. Что придёт на вход от реальной кнопки — решает её подключение.</p>`,
quiz:[{q:'Контакт НО с операндом %I0.0. На входе 1. Пропускает ли он ток?',o:['Да','Нет'],a:0,e:'НО контакт замкнут, когда бит = 1.'},
{q:'Два контакта соединены параллельно. Это…',o:['Логическое И','Логическое ИЛИ','Инверсия'],a:1,e:'Параллельные ветви: достаточно, чтобы ток прошёл по любой из них.'},
{q:'Контакт НЗ с операндом "Stop". На входе 1. Ток проходит?',o:['Да','Нет'],a:1,e:'НЗ контакт в программе замкнут только при бите 0.'}]},
{id:'b5',title:'Как работать в редакторе',html:`<p><b>1.</b> Выбери на панели инструмент: НО, НЗ, Выход, Set, Reset, таймер или счётчик. Новый элемент встаёт после выбранного или в конец сети.</p>
<p><b>2.</b> Тапни элемент в сети — под панелью появится строка операндов. Тапни нужный тег, чтобы назначить адрес. У контакта там же есть «Сделать НЗ/НО».</p>
<p><b>3.</b> «Ветвь» делает параллельную ветвь к выбранному контакту.</p>
<p><b>4.</b> Тапни шапку сети «Сеть N» — выберешь всю сеть: можно дать ей заголовок и комментарий, переместить выше или ниже, вставить новую сеть над ней или под ней.</p>
<p><b>5.</b> «В ПЛК» компилирует и загружает программу. Пока не загрузил, ПЛК работает по старой. После загрузки нажимай кнопки на пульте и смотри, как в режиме «Мониторинг» по сети течёт ток: зелёным — где есть сигнал.</p>
<p><b>6.</b> «Проверить решение» прогоняет автотест задания и показывает, что сработало, а что нет.</p>`,
quiz:[{q:'Ты поменял программу, но лампа ведёт себя по-старому. Почему?',o:['Программа не загружена «В ПЛК»','Сломан выход','Нужно перезапустить приложение'],a:0,e:'Изменения начинают работать только после загрузки в ПЛК — как и в настоящем TIA Portal.'}]},
{id:'b6',title:'Фронты P и N',html:`<p>Обычный контакт смотрит на <b>уровень</b> сигнала: пока кнопка нажата, он замкнут каждый цикл. Иногда нужно другое: сработать <b>один раз</b> в момент нажатия.</p>
${mini({s:[['P','"Button"']],c:[['=','"Pulse"']]})}
<p><b>Контакт P</b> (положительный фронт) замкнут ровно <b>один цикл</b> — в том, где сигнал сменился с 0 на 1. <b>Контакт N</b> (отрицательный фронт) — один цикл при смене с 1 на 0.</p>
<p>Без фронта кнопка, которую держат 0,3 с, при цикле 30 мс «сработает» 10 раз подряд. С фронтом — один раз, сколько бы её ни держали.</p>
<p>Где нужны фронты: переключение одной кнопкой (импульсное реле), запоминание <b>нового</b> события аварии, счёт событий, действие в момент окончания чего-то (контакт N).</p>
<p>В TIA Portal под контактом P указывают ещё и <b>меркер памяти фронта</b> — там ПЛК хранит прошлое значение сигнала. У каждого контакта P/N он должен быть свой. Здесь приложение делает это само.</p>`,
quiz:[{q:'Кнопку держат 2 секунды. Сколько циклов замкнут контакт P на ней?',o:['Один','Все циклы, пока держат','Ни одного'],a:0,e:'P замкнут только в цикле, где сигнал перешёл из 0 в 1.'},
{q:'Насос выключился. Какой контакт поймает этот момент?',o:['P на выходе насоса','N на выходе насоса','НЗ на выходе насоса'],a:1,e:'Выключение — переход 1→0, это отрицательный фронт, контакт N.'}]},
{id:'b7',title:'Датчики и концевики',html:`<p>Кроме кнопок, к входам подключают <b>датчики</b>: они сами сообщают о состоянии объекта.</p>
<p><b>Концевой выключатель</b> (концевик, SQ) нажимается механизмом в крайнем положении. Обычно его подключают <b>НЗ</b> контактом: пока механизм не доехал, на входе 1, доехал — 0. Если провод оборвётся, ПЛК увидит 0, как будто концевик нажат, и механизм остановится. Это та же защита от обрыва, что у кнопки Стоп.</p>
<p>Поэтому в цепь движения ставят <b>НО</b> контакт своего концевика: пока 1 — едем, нажат (0) — стоп.</p>
${mini({s:[['NO','"SQ_Open"'],['NC','"Gate_Close"'],['PAR',[[['NO','"Open"']],[['NO','"Gate_Open"']]]]],c:[['=','"Gate_Open"']]})}
<p><b>Датчики уровня</b> (SL) здесь дают 1, когда находятся в воде. Двумя датчиками делают <b>гистерезис</b>: насос включается на нижнем уровне и выключается на верхнем, а между ними сохраняет своё состояние. Без этого насос щёлкал бы каждую секунду около одной отметки.</p>
<p>В задачах с объектом внизу пульта видно сам механизм или бак. Если программа уведёт его за концевик или перельёт бак — проверка это заметит.</p>`,
quiz:[{q:'Концевик SQ2 подключён НЗ. Механизм доехал до него. Что на входе?',o:['1','0'],a:1,e:'Механизм нажал концевик, его НЗ контакт разомкнулся — на входе 0.'},
{q:'Зачем нижний и верхний датчик уровня, а не один?',o:['Чтобы насос не включался и не выключался слишком часто','Для резерва','Так дешевле'],a:0,e:'Это гистерезис: между уровнями состояние насоса сохраняется.'}]}

];
const LESSONS={
t1:{title:'Вход, выход и простейшая сеть',html:`<p>Самая простая программа: выход повторяет вход. Пока бит <code>%I0.0</code> = 1, контакт НО замкнут, ток доходит до катушки, и она пишет 1 в <code>%Q0.1</code>.</p>
${mini({s:[['NO','"Start"']],c:[['=','"Lamp_Run"']]})}
<p>Отпустил кнопку — вход 0, контакт разомкнут, катушка пишет 0, лампа гаснет. Катушка «Выход» ничего не помнит: каждый цикл она заново записывает то, что пришло слева.</p>
<p>Так работает кнопка без фиксации. Чтобы мотор продолжал работать после отпускания кнопки, нужна память — это следующий урок.</p>`,
quiz:[{q:'Что запишет катушка, если до неё не дошёл ток?',o:['0','Оставит прежнее значение','1'],a:0,e:'Обычная катушка всегда записывает результат: нет тока — 0.'},
{q:'Где лампа HL1 в этой задаче?',o:['%I0.1','%Q0.1','%M0.1'],a:1,e:'Лампа — исполнительное устройство, она на выходе %Q0.1.'}]},
t2:{title:'Самоподхват и кнопка Стоп',html:`<p><b>Самоподхват</b> — классика релейных схем: параллельно кнопке Пуск ставят контакт самого выхода. Нажал Пуск — выход включился, и теперь он сам держит себя через свою ветвь.</p>
${mini({s:[['NO','"Stop"'],['PAR',[[['NO','"Start"']],[['NO','"Motor"']]]]],c:[['=','"Motor"'],['=','"Lamp_Run"']]})}
<p><b>Почему Стоп — НО контакт в программе?</b> Кнопка SB2 в шкафу подключена <b>НЗ</b> контактом. В покое цепь замкнута, на <code>%I0.1</code> приходит 1. Чтобы ток проходил, пока Стоп не нажат, нужен контакт, который замкнут при 1, — это НО. Нажали Стоп — вход 0, цепь разорвана.</p>
<p>Зачем так сложно? Это <b>защита от обрыва</b>: если провод от кнопки Стоп оборвётся, на входе станет 0, и мотор остановится, а не останется без возможности остановки.</p>
<p><b>Стоп важнее Пуска:</b> контакт Стоп стоит последовательно перед всей параллельной группой, поэтому при нажатом Стоп не поможет ни Пуск, ни подхват.</p>`,
quiz:[{q:'SB2 «Стоп» подключена НЗ контактом. Что на %I0.1, когда её не трогают?',o:['1','0'],a:0,e:'НЗ контакт кнопки в покое замкнут — на вход приходит 24 В, это 1.'},
{q:'Какой контакт нужен в программе для такого Стопа?',o:['НО','НЗ'],a:0,e:'В покое вход = 1, и цепь должна быть замкнута — значит, контакт НО.'},
{q:'Что даёт подключение Стопа НЗ контактом?',o:['Мотор остановится при обрыве провода','Кнопка дольше служит','Можно не ставить подхват'],a:0,e:'Обрыв выглядит для ПЛК как нажатый Стоп — это безопасный отказ.'}]},
t3:{title:'Set, Reset и запоминание аварии',html:`<p>Катушка «Выход» не помнит состояние. Для памяти есть пара катушек:</p>
<p><b>Set (S)</b> — если ток дошёл, пишет 1. Если не дошёл — <b>ничего не меняет</b>.<br><b>Reset (R)</b> — если ток дошёл, пишет 0. Если нет — ничего не меняет.</p>
${mini({s:[['NC','"Thermal_OK"']],c:[['S','"Fault"']]})}
${mini({s:[['NO','"Reset"'],['NO','"Thermal_OK"']],c:[['R','"Fault"']]})}
<p>Так бит <code>"Fault"</code> (меркер %M0.0) запоминает аварию, даже когда реле уже вернулось в норму. Сбросить её может только оператор — это называется <b>квитирование</b>: человек подтверждает, что видел аварию.</p>
<p>Если Set и Reset сработают в одном цикле, победит та сеть, что ниже: <b>последняя запись побеждает</b>.</p>
<p>Тепловое реле KK1 подключено <b>НЗ контактом 95-96</b>: в норме на <code>%I0.2</code> = 1. Сработало — 0. Поэтому «реле сработало» в программе — это НЗ контакт на <code>"Thermal_OK"</code>.</p>
<p>Для мигания поставь последовательно с <code>"Fault"</code> контакт <code>"Clock_1Hz"</code>.</p>`,
quiz:[{q:'До катушки Set не дошёл ток. Что будет с битом?',o:['Станет 0','Не изменится','Станет 1'],a:1,e:'Set и Reset действуют только при токе, иначе бит хранит прежнее значение.'},
{q:'Что такое квитирование?',o:['Автоматический сброс аварии','Подтверждение аварии оператором','Мигание лампы'],a:1,e:'Авария сбрасывается только после действия человека, который увидел её причину.'},
{q:'Set в сети 2 и Reset в сети 4 сработали в одном цикле. Итог?',o:['1','0'],a:1,e:'Сеть 4 ниже, её запись последняя — бит = 0.'}]},
t4:{title:'Таймер с задержкой включения TON',html:`<p><b>TON</b> (on-delay) — задержка включения. У блока есть вход <b>IN</b>, время <b>PT</b> и выход <b>Q</b>; текущее время видно как <b>ET</b>.</p>
${mini({s:[['NO','"Motor"'],['TON','T#3S']],c:[['=','"Fan"']]})}
<p>Подал 1 на IN — таймер начал отсчёт. Когда ET дошло до PT, выход Q = 1 и держится, пока IN = 1. Пропал IN — Q = 0 и ET сбрасывается в ноль <b>сразу</b>.</p>
<p>Если IN был 1 меньше PT, выход так и не включится: таймер начнёт отсчёт заново при следующем включении.</p>
<p>У каждого таймера S7-1200 есть свой <b>экземплярный блок данных</b> (instance DB), например <code>"IEC_Timer_0_DB"</code>: там хранится его состояние. Значение ET видно в таблице тегов.</p>
<p>Время записывается так: <code>T#3S</code>, <code>T#500MS</code>, <code>T#1S_200MS</code>.</p>`,
quiz:[{q:'PT = 3 с. Мотор проработал 2 с и остановился. Включился ли вентилятор?',o:['Да, на 1 с','Нет','Да, после останова'],a:1,e:'IN пропал до окончания отсчёта, ET сбросился, Q так и не стал 1.'},
{q:'Что происходит с Q сразу после того, как IN стал 0?',o:['Q = 0 сразу','Q = 0 через PT'],a:0,e:'TON выключается мгновенно. Задержка выключения — это TOF.'}]},
t5:{title:'Таймер с задержкой отключения TOF',html:`<p><b>TOF</b> (off-delay) — задержка отключения, зеркальный TON.</p>
${mini({s:[['NO','"Motor"'],['TOF','T#5S']],c:[['=','"Fan"']]})}
<p>IN = 1 → выход Q = 1 <b>сразу</b>. IN пропал → таймер начинает отсчёт, Q остаётся 1 ещё время PT, потом становится 0. Если IN снова появился во время отсчёта, отсчёт сбрасывается, Q остаётся 1.</p>
<p>Типичное применение — <b>выбег</b>: вентилятор охлаждает двигатель после останова, насос дотягивает остатки, лампа подсветки гаснет не сразу.</p>`,
quiz:[{q:'Когда Q у TOF становится 1?',o:['Сразу с IN','Через PT после IN'],a:0,e:'TOF включается без задержки, задерживается только выключение.'},
{q:'PT = 5 с. Мотор остановили, а через 2 с снова запустили. Что с вентилятором?',o:['Выключится на мгновение','Будет работать без перерыва'],a:1,e:'IN вернулся до конца отсчёта — Q так и не упал, отсчёт сброшен.'}]},
t6:{title:'Счётчик CTU',html:`<p><b>CTU</b> (count up) — счётчик вверх. Входы: <b>CU</b> — счёт, <b>R</b> — сброс, <b>PV</b> — уставка. Выходы: <b>CV</b> — текущее значение, <b>Q</b> = 1, когда CV ≥ PV.</p>
${mini({s:[['NO','"Sensor"'],['NO','"Conveyor"'],['CTU','PV=5']],c:[['=','"Done"']]})}
<p>Счётчик считает <b>фронты</b> — моменты, когда CU меняется с 0 на 1. Деталь стоит под датчиком сколько угодно долго, но засчитана будет один раз. Без этого за одно касание ПЛК насчитал бы сотни: цикл ведь 30 мс.</p>
<p>R = 1 обнуляет CV и держит его в нуле, пока R не пропадёт.</p>
<p>Чтобы остановить конвейер по готовой партии, выход Q пишут в меркер и ставят этот меркер <b>НЗ контактом</b> в цепь пуска: партия готова — цепь разорвана.</p>`,
quiz:[{q:'Деталь 2 секунды стоит под датчиком. Сколько насчитает CTU?',o:['1','Примерно 66','2'],a:0,e:'CTU считает только переход 0→1, длительность сигнала не важна.'},
{q:'PV = 5, CV = 5. Чему равен Q?',o:['0','1'],a:1,e:'Q = 1, когда CV ≥ PV.'}]},
t7:{title:'Реверс и блокировка',html:`<p>Реверсивный пуск — два контактора: KM1 «вперёд» и KM2 «назад». Они меняют местами две фазы. Если включить оба сразу — <b>межфазное короткое замыкание</b>.</p>
<p>Поэтому в цепь каждого контактора ставят <b>НЗ контакт другого</b> — это <b>взаимная блокировка</b>:</p>
${mini({s:[['NO','"Stop"'],['PAR',[[['NO','"Fwd"']],[['NO','"Motor_Fwd"']]]],['NC','"Motor_Back"']],c:[['=','"Motor_Fwd"']]})}
<p>Пока работает «назад», НЗ контакт <code>"Motor_Back"</code> разомкнут, и «вперёд» не включится, хоть жми. Сеть «назад» строится так же, зеркально.</p>
<p>В настоящем шкафу программной блокировки <b>мало</b>: контактор может залипнуть, ПЛК — не знать об этом. Поэтому дублируют <b>электрической блокировкой</b> — НЗ блок-контактами KM1 и KM2 прямо в цепях катушек, а часто ещё и механической.</p>`,
quiz:[{q:'Что будет, если KM1 и KM2 включатся одновременно?',o:['Мотор остановится','Межфазное КЗ','Мотор пойдёт быстрее'],a:1,e:'Реверсор меняет две фазы местами, при обоих включённых они замыкаются между собой.'},
{q:'Какой контакт ставят в цепь «вперёд» для блокировки?',o:['НО "Motor_Back"','НЗ "Motor_Back"'],a:1,e:'НЗ контакт размыкается, когда «назад» включён, и не даёт включить «вперёд».'},
{q:'Хватит ли в реальном шкафу только программной блокировки?',o:['Да','Нет, нужна и электрическая'],a:1,e:'Залипший контактор ПЛК не увидит — защищают блок-контакты в цепях катушек.'}]}
};
const QA={};

function markLesson(key){
 if(key[0]==='b'){STORE.__basics=STORE.__basics||{};STORE.__basics[key]=true;}
 else STORE[key]=Object.assign({},STORE[key]||{},{lesson:true});
 try{localStorage.setItem(LS,JSON.stringify(STORE));}catch(e){}
}
function lessonHTML(key,L){
 const ans=QA[key]||{},quiz=L.quiz||[];
 const ok=quiz.every((q,i)=>ans[i]===q.a);
 const qh=quiz.map((q,i)=>{const a=ans[i];return`<div class="q"><div class="qq">${i+1}. ${q.q}</div><div class="qo">${q.o.map((o,j)=>`<button class="qb ${a===j?(j===q.a?'right':'wrong'):''}" data-qa="${key}|${i}|${j}">${o}</button>`).join('')}</div>${a!=null?`<div class="qe ${a===q.a?'right':'wrong'}">${a===q.a?'Верно. ':'Не совсем. '}${q.e}</div>`:''}</div>`;}).join('');
 return`<div class="lesson"><div class="th">${L.html}</div>${quiz.length?`<div class="quiz"><div class="qt">Проверь себя</div>${qh}</div>`:''}${ok?`<div class="qdone">✓ Урок пройден</div>`:''}</div>`;
}
function renderBasics(){
 const ov=$('#basics');if(!S.basics){ov.hidden=true;document.body.classList.remove('noscroll');return;}
 const i=S.bi,L=BASICS[i];ov.hidden=false;document.body.classList.add('noscroll');
 const nav=BASICS.map((b,j)=>`<button class="${j===i?'act':''} ${lessonDone(b.id)?'ok':''}" data-bl="${j}">${j+1}. ${b.title}</button>`).join('');
 ov.innerHTML=`<div class="bwrap card"><div class="bhd"><b>Основы ПЛК</b><button class="mini" data-act="bclose">Закрыть</button></div><nav class="tabs">${nav}</nav><h2>${L.title}</h2>${lessonHTML(L.id,L)}<div class="tact">${i>0?`<button class="ghost" data-bl="${i-1}">← Назад</button>`:''}${i<BASICS.length-1?`<button class="primary" data-bl="${i+1}">Дальше →</button>`:`<button class="primary" data-act="bclose">К заданиям →</button>`}</div></div>`;
 ov.scrollTop=0;
 const tb=ov.querySelector('.tabs'),ac=tb.querySelector('.act');if(ac)tb.scrollLeft=ac.offsetLeft-tb.clientWidth/2+ac.offsetWidth/2;
}

/* ---------- объекты (физика) ---------- */
function tankPlant(o){return{type:'tank',o,
 init:()=>({lv:o.lv0||0,max:o.lv0||0,over:false,dry:false}),
 step(c,dt){const p=c.pl;let r=o.inflow||0;
  for(const a in o.fill||{})if(c.bits[a])r+=o.fill[a];
  for(const a in o.drain||{})if(c.bits[a]){r-=o.drain[a];if(p.lv<=0.05)p.dry=true;}
  if(o.cons&&c.dev[o.cons.id])r-=o.cons.rate;
  if(o.rain&&c.dev[o.rain.id])r+=o.rain.rate;
  p.lv=Math.max(0,Math.min(100,p.lv+r*dt));if(p.lv>=100&&r>0)p.over=true;p.max=Math.max(p.max,p.lv);
  for(const s of o.sens)c.dev[s.id]=p.lv>=s.lv;},
 checks:[['over','Бак ни разу не переполнился'],['dry','Насос ни разу не работал всухую']]};}
function axisPlant(o){return{type:'axis',o,
 init:()=>({pos:o.pos0||0,ot:0,ht:0,over:false,short:false,hit:false}),
 step(c,dt){const p=c.pl,f=!!c.bits[o.fwd],r=!!c.bits[o.rev];
  if(f&&r)p.short=true;else if(f)p.pos+=o.spd*dt;else if(r)p.pos-=o.spd*dt;
  p.pos=Math.max(0,Math.min(100,p.pos));
  if((f&&p.pos>=100)||(r&&p.pos<=0)){p.ot+=dt;if(p.ot>0.35)p.over=true;}else p.ot=0;

  const pipe=(acts,x1,y,x2,lbl)=>{const id=nid('pp');B.push({id,fn:()=>acts.some(a=>S.bits[a])});return`<line class="pipe" id="${id}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><text class="plb" x="${Math.min(x1,x2)}" y="${y-5}">${lbl}</text>`;};

  const mid=nid('pa'),lo=nid('pl'),hi=nid('ph');

  const ob=o.obst?nid('po'):null;if(ob)B.push({id:ob,fn:()=>S.dev[o.obst]});
  if(o.view==='gate'){

   svg=`<svg viewBox="0 0 240 74" class="pls"><line class="grd" x1="4" y1="62" x2="236" y2="62"/><rect class="post" x="114" y="14" width="6" height="48"/><rect class="post" x="220" y="14" width="6" height="48"/><g id="${mid}"><rect class="gate" x="120" y="20" width="100" height="38" rx="2"/><path class="gbar" d="M130 20v38M150 20v38M170 20v38M190 20v38M210 20v38"/></g>${ob?`<g class="car" id="${ob}"><rect x="150" y="44" width="40" height="14" rx="4"/></g>`:''}<circle class="pled" id="${lo}" cx="223" cy="8" r="4"/><text class="plb" x="196" y="11">${o.lo}</text><circle class="pled" id="${hi}" cx="117" cy="8" r="4"/><text class="plb" x="124" y="11">${o.hi}</text></svg>`;
  }else if(o.view==='cart'){

   svg=`<svg viewBox="0 0 240 74" class="pls"><line class="grd" x1="16" y1="56" x2="224" y2="56"/><g id="${mid}"><rect class="gate" x="20" y="28" width="40" height="22" rx="3"/><circle class="whl" cx="30" cy="52" r="4"/><circle class="whl" cx="50" cy="52" r="4"/></g><circle class="pled" id="${lo}" cx="14" cy="18" r="4"/><text class="plb" x="22" y="21">${o.lo}</text><circle class="pled" id="${hi}" cx="226" cy="18" r="4"/><text class="plb" x="196" y="21">${o.hi}</text></svg>`;
  }else{
   B.push({id:mid,draw:el=>el.setAttribute('transform',`rotate(${-S.pl.pos*0.85} 44 100)`)});
   svg=`<svg viewBox="0 0 240 118" class="pls"><line class="grd" x1="4" y1="114" x2="236" y2="114"/><rect class="post" x="36" y="94" width="14" height="20"/><g id="${mid}"><rect class="boom" x="44" y="97" width="110" height="6" rx="3"/></g>${ob?`<g class="car" id="${ob}"><rect x="100" y="98" width="44" height="14" rx="4"/></g>`:''}<circle class="pled" id="${lo}" cx="164" cy="100" r="4"/><text class="plb" x="172" y="103">${o.lo}</text><circle class="pled" id="${hi}" cx="62" cy="10" r="4"/><text class="plb" x="70" y="13">${o.hi}</text></svg>`;
  }
 }else return'';
 return`<div class="plant"><div class="plh"><span>Объект</span><span class="pflag" id="${fid}"></span><button class="mini" data-act="preset">Сбросить объект</button></div>${svg}</div>`;
}

 tests:[{set:{lv:30}},{x:{'Q0.0':0},m:'На среднем уровне насос стоит'},{t:'RN'},{until:{'Q0.0':1},in:13000,m:'Верхний уровень — насос включился'},{until:{'Q0.0':0},in:16000,m:'Откачал до нижнего уровня'},{xs:p=>p.lv>=10&&p.lv<=16,m:'Насос остановился у SL1'},{set:{lv:95}},{x:{'Q0.1':1,'Q0.0':1},m:'Аварийный уровень: HL1 горит, насос работает'},{until:{'Q0.1':0},in:3000,m:'Уровень упал — HL1 погас'},{t:'RN'}]},

 io:{SL1:sn('Нижний уровень','I0.0','NO','Level_Low'),SL2:sn('Верхний уровень','I0.1','NO','Level_High'),XV:tg('Расход воды',null,'NO','Закрыт','Открыт'),M1:ou('motor','Насос 1','Q0.0','Pump_1'),M2:ou('motor','Насос 2','Q0.1','Pump_2')},
 plant:tankPlant({sens:[{id:'SL1',lv:20},{id:'SL2',lv:80}],fill:{'Q0.0':10,'Q0.1':10},cons:{id:'XV',rate:5},lv0:10}),
 goal:'Бак наполняется по двум уровням, но насосов два. Чтобы они изнашивались равномерно, каждое следующее наполнение делает другой насос: 1, 2, 1, 2…',
 hint:`<p>Сделай меркер «нужно наливать» с гистерезисом. На его заднем фронте (контакт N) переключай меркер выбора насоса, как в импульсном реле. Насос 1 = налив И НЕ выбор, насос 2 = налив И выбор.</p>`,
 tests:[{set:{lv:10}},{x:{'Q0.0':1,'Q0.1':0},m:'Первое наполнение — насос 1'},{until:{'Q0.0':0},in:9000,m:'Бак наполнен'},{t:'XV'},{until:{'Q0.1':1},in:14000,m:'Второе наполнение — насос 2'},{x:{'Q0.0':0},m:'Насос 1 при этом стоит'},{until:{'Q0.1':0},in:16000,m:'Бак наполнен'},{until:{'Q0.0':1},in:14000,m:'Третье наполнение — снова насос 1'},{x:{'Q0.1':0},m:'Насос 2 стоит'},{t:'XV'}]},
{id:'c12',cat:2,lvl:2,name:'Защита от сухого хода',topics:['Set/Reset','Мигание'],
 io:{SB1:bt('Пуск','I0.0','NO','green','Start'),SB2:bt('Стоп','I0.1','NC','red','Stop'),SL1:sn('Сухой ход','I0.2','NO','Level_Min'),SL2:sn('Уровень в норме','I0.3','NO','Level_OK'),M1:ou('motor','Насос','Q0.0','Pump'),HL1:ou('lamp','Нет воды','Q0.1','Lamp_NoWater','yellow')},
 plant:tankPlant({sens:[{id:'SL1',lv:10},{id:'SL2',lv:50}],drain:{'Q0.0':8},inflow:3,lv0:60}),
 goal:'Насос качает воду из колодца по кнопкам Пуск/Стоп. Вода ниже SL1 — насос останавливается и мигает HL1. Когда колодец наполнится до SL2, насос сам запускается снова, если его не останавливали кнопкой Стоп.',
 hint:`<p>Меркер «команда» с самоподхватом. Меркер «вода есть»: Set по SL2, Reset по НЕ SL1. Насос = команда И вода есть. HL1 = команда И НЕ вода есть И Clock_1Hz.</p>`,
 tests:[{set:{lv:60}},pr('SB1'),{x:{'Q0.0':1},m:'Пуск'},{until:{'Q0.0':0},in:12000,m:'Вода ниже SL1 — насос остановился'},{blink:'Q0.1',in:1500,m:'HL1 мигает'},{until:{'Q0.0':1},in:16000,m:'Колодец наполнился — насос запустился сам'},{x:{'Q0.1':0},m:'HL1 погас'},pr('SB2'),{x:{'Q0.0':0},m:'Стоп'},{set:{lv:5}},{stay:{'Q0.0':0,'Q0.1':0},in:1500,m:'После Стоп насос не запускается и HL1 не мигает'}]},
{id:'c13',cat:2,lvl:3,name:'Дозатор: три замеса',topics:['Шаги на Set/Reset','CTU','TON'],
 io:{SB1:bt('Пуск','I0.0','NO','green','Start'),SB2:bt('Стоп','I0.1','NC','red','Stop'),SL1:sn('Нижний уровень','I0.2','NO','Level_Low'),SL2:sn('Верхний уровень','I0.3','NO','Level_High'),SB3:bt('Сброс','I0.4','NO','blue','Reset'),YV1:ou('valve','Налив','Q0.0','Valve_In'),M1:ou('motor','Мешалка','Q0.1','Mixer'),YV2:ou('valve','Слив','Q0.2','Valve_Out'),HL1:ou('lamp','Готово','Q0.3','Lamp_Done','green')},
 plant:tankPlant({sens:[{id:'SL1',lv:20},{id:'SL2',lv:80}],fill:{'Q0.0':12},drain:{'Q0.2':15},lv0:0}),
 goal:'Пуск запускает цикл: налив до SL2 → перемешивание 5 с → слив до SL1 → снова налив. После трёх замесов установка останавливается и горит HL1. SB3 «Сброс» гасит HL1. Стоп прерывает работу в любой момент.',
 hint:`<p>Меркер «работа»: Set по Пуску, Reset по Стопу и по окончании. Каждый шаг — свой меркер: налив, мешалка, слив. Переход — Set следующего и Reset текущего.</p><p>Налив начинается, когда работа И бак пуст И ни один шаг не активен. Выходы = работа И меркер шага. CTU считает окончания слива, PV = 3, R = Сброс.</p>`,
 tests:[{set:{lv:0}},pr('SB1'),{x:{'Q0.0':1,'Q0.1':0,'Q0.2':0},m:'Шаг 1: налив'},{until:{'Q0.0':0},in:8000,m:'Налив до верхнего уровня'},{x:{'Q0.1':1,'Q0.2':0},m:'Шаг 2: мешалка'},{w:4500},{x:{'Q0.1':1,'Q0.2':0},m:'Мешает 5 с'},{until:{'Q0.2':1,'Q0.1':0},in:1000,m:'Шаг 3: слив'},{until:{'Q0.2':0},in:6000,m:'Слив до нижнего уровня'},{w:200},{x:{'Q0.0':1},m:'Сразу следующий замес'},{until:{'Q0.3':1},in:40000,m:'После трёх замесов горит HL1'},{x:{'Q0.0':0,'Q0.1':0,'Q0.2':0},m:'Установка остановлена'},{w:3000},{x:{'Q0.0':0},m:'И сама не запускается'},pr('SB3'),{x:{'Q0.3':0},m:'Сброс гасит HL1'},pr('SB1'),{x:{'Q0.0':1},m:'Новый пуск'},{w:3000},pr('SB2'),{x:{'Q0.0':0},m:'Стоп прерывает работу'}]},
{id:'c14',cat:3,lvl:2,name:'Ворота с концевиками',topics:['Концевики','Блокировка'],

 hint:`<p>Как реверс с блокировкой, только в цепь каждого направления добавь НО контакт своего концевика: нажат — на входе 0, цепь разорвана.</p>`,

{id:'c15',cat:3,lvl:3,name:'Автоматические ворота',topics:['Фотобарьер','TON','Set/Reset'],

 plant:axisPlant({fwd:'Q0.0',rev:'Q0.1',spd:20,lo:'SQ1',hi:'SQ2',obst:'BL1',view:'gate'}),
 goal:'Открыть — ворота открываются. Через 5 с после полного открытия закрываются сами. Если при закрывании перекрыли фотобарьер BL1 — сразу едут обратно на открывание. Пока барьер перекрыт, не закрываются. HL1 мигает, пока ворота движутся.',
 hint:`<p>Закрывание И барьер перекрыт → Set меркера «реверс». Этот меркер стоит параллельно кнопке Открыть, а Reset ему даёт само открывание.</p><p>Автозакрытие: на SQ2 И барьер свободен → TON 5 с. HL1 = (KM1 ИЛИ KM2) И Clock_1Hz.</p>`,

{id:'c16',cat:3,lvl:2,name:'Тележка туда-обратно',topics:['Концевики','TON'],

{id:'c17',cat:3,lvl:2,name:'Шлагбаум',topics:['Концевики','TON'],

{id:'c18',cat:4,lvl:2,name:'Светофор',topics:['Цепочка TON','Мигание'],
 io:{SA1:tg('Светофор','I0.0','NO','Выкл','Вкл','On'),HL1:ou('lamp','Красный','Q0.0','Red','red'),HL2:ou('lamp','Жёлтый','Q0.1','Yellow','yellow'),HL3:ou('lamp','Зелёный','Q0.2','Green','green')},
 goal:'Цикл: красный 5 с → красный+жёлтый 2 с → зелёный 5 с → жёлтый 2 с → снова красный. В положении SA1 «Выкл» мигает только жёлтый.',
 hint:`<p>Цепочка из четырёх TON: каждый запускается выходом предыдущего, первый — от SA1 И НЕ выход последнего. Так цепочка сама сбрасывается и начинается заново.</p><p>Красный = SA1 И НЕ T2. Зелёный = T2 И НЕ T3. Жёлтый = (T1 И НЕ T2) ИЛИ T3 ИЛИ (НЕ SA1 И Clock_1Hz).</p>`,

{id:'c19',cat:4,lvl:2,name:'Авария с квитированием',topics:['P-фронт','Set/Reset','Мигание'],
 io:{B1:tg('Давление','I0.0','NO','Норма','Авария','Alarm_Press'),SB1:bt('Квитирование','I0.1','NO','blue','Ack'),HL1:ou('lamp','Авария','Q0.0','Lamp_Alarm','red'),HA1:ou('horn','Сирена','Q0.1','Horn')},

 hint:`<p>Фронт P аварии → Set меркера «не квитировано». Квитирование → Reset. Лампа = (меркер И Clock_1Hz) ИЛИ (НЕ меркер И авария). Сирена = меркер.</p>`,

{id:'c20',cat:4,lvl:3,name:'Охранная сигнализация',topics:['TON','Set/Reset','Мигание'],

 hint:`<p>SA1 → TON 10 с → меркер «взято». HL1 = (SA1 И НЕ взято И Clock) ИЛИ взято. Взято И дверь открыта → Set меркера «проникновение», НЕ SA1 → Reset. Проникновение → TON 5 с → сирена.</p>`,
